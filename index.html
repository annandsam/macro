<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0c0b09; --chalk: #ede9e4; --stone: #6e6860;
    --amber: #b89060; --slate: #1a1815;
    --black: #111111; --white: #ffffff; --border: 2px solid #111111; --yellow: #3f5d77;
  }
  html { height: 100%; }
  body {
    height: 100%; background: var(--yellow); color: var(--chalk);
    font-family: 'Cormorant Garamond', Georgia, serif;
    padding: 12px; overflow: hidden;
  }
  .site-wrap {
    display: flex; flex-direction: column; height: calc(100vh - 24px); height: calc(100dvh - 24px);
    background: var(--ink); border-radius: 18px; border: var(--border); overflow: hidden;
  }

  /* ── NAV ── */
  nav {
    display: flex; align-items: stretch;
    border-bottom: var(--border); border-radius: 16px 16px 0 0;
    position: relative; background: var(--white); flex-shrink: 0;
  }
  .nav-logo {
    font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--black); text-decoration: none;
    padding: 22px 28px; border-right: var(--border);
    white-space: nowrap; display: flex; align-items: center;
  }
  .nav-links { display: flex; list-style: none; flex: 1; }
  .nav-item { position: relative; flex: 1; }
  .nav-item > a {
    display: flex; align-items: center; justify-content: center;
    height: 100%; width: 100%; padding: 22px 22px;
    font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--black); text-decoration: none;
    border-right: var(--border); white-space: nowrap;
    transition: background 0.15s;
  }
  .nav-item:last-child > a { border-right: none; }
  .nav-item > a:hover { background: var(--yellow); color: var(--black); }

  .dropdown-wrap {
    position: absolute; top: 100%; left: -2px;
    overflow: hidden; max-height: 0;
    transition: max-height 0.3s ease;
    width: calc(var(--dropdown-w, 200px) + 2px); z-index: 100;
  }
  .nav-item:hover > .dropdown-wrap {
    max-height: 400px; overflow: visible; pointer-events: all;
  }
  .dropdown {
    background: var(--white); border: var(--border); pointer-events: none;
  }
  .nav-item:hover > .dropdown-wrap .dropdown { pointer-events: all; }
  .dropdown a {
    display: flex; align-items: center; height: 40px; padding: 0 20px;
    font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--black); text-decoration: none;
    border-bottom: var(--border); transition: background 0.15s; white-space: nowrap;
  }
  .dropdown a:last-child { border-bottom: none; }
  .dropdown a:hover { background: var(--yellow); color: var(--black); }
  .dd-divider { display: none; }

  /* ── LAYOUT ── */
  .hero {
    height: 100dvh; display: grid; grid-template-columns: 1fr 1fr;
  }

  /* ── LEFT ── */
  .hero-left {
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 48px 48px 64px;
    background: #4887c9;
  }
  h1.hero-name {
    font-family: 'Bodoni Moda', Georgia, serif;
    font-size: clamp(58px, 6.5vw, 105px);
    font-weight: 400; line-height: 1;
    letter-spacing: 0em; color: var(--chalk);
    opacity: 0; animation: fadeUp 1s ease 0.4s forwards;
    white-space: nowrap;
  }
  .hero-role {
    margin-top: 16px;
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(237,233,228,0.45);
    opacity: 0; animation: fadeUp 1s ease 0.6s forwards;
  }

  /* ── RIGHT: PAINTING ── */
  .hero-right { position: relative; overflow: hidden; }
  .painting-wrap {
    position: absolute; inset: 0;
    opacity: 0; animation: fadeIn 1.5s ease 0.1s forwards;
    display: flex; align-items: center; justify-content: center;
  }
  .painting-img {
    width: 100%; height: 100%; object-fit: cover;
    object-position: 50% 50%; display: block;
    filter: saturate(0.88) brightness(0.94);
  }
  .painting-caption {
    position: absolute; bottom: 32px; right: 32px;
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(237,233,228,0.35); text-align: right; line-height: 1.8;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  .flyout-item { position: relative; }
  .flyout-trigger {
    display: flex; justify-content: space-between; align-items: center;
    height: 40px; padding: 0 20px;
    font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--black); text-decoration: none;
    border-bottom: var(--border); cursor: default;
    transition: background 0.15s; white-space: nowrap;
  }
  .flyout-item:last-child > .flyout-trigger { border-bottom: none; }
  .flyout-trigger:hover { background: var(--yellow); color: var(--black); }
  .flyout-arrow { opacity: 0.5; margin-left: 12px; font-size: 9px; }
  .flyout {
    position: absolute; left: 100%; top: -2px;
    background: var(--white); border: var(--border);
    width: calc(var(--flyout-w, 200px) + 2px);
    clip-path: inset(0 100% 0 0);
    transition: clip-path 0.22s ease;
    pointer-events: none;
  }
  .flyout-item:hover > .flyout { clip-path: inset(0 0% 0 0); pointer-events: all; }
  .flyout a {
    display: flex; align-items: center; height: 40px; padding: 0 20px;
    font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--black); text-decoration: none;
    border-bottom: var(--border); transition: background 0.15s; white-space: nowrap;
  }
  .flyout a:last-child { border-bottom: none; }
  .flyout a:hover { background: var(--yellow); color: var(--black); }

  .nav-hamburger {
    display: none; background: none; border: none; cursor: pointer;
    padding: 22px 24px; flex-direction: column; gap: 5px;
    z-index: 300; margin-left: auto; border-left: var(--border);
  }
  .nav-hamburger span {
    display: block; width: 22px; height: 2px; background: var(--black);
    transition: transform 0.25s, opacity 0.25s; transform-origin: center;
  }
  nav.nav-open .nav-hamburger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  nav.nav-open .nav-hamburger span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  nav.nav-open .nav-hamburger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    body { padding: 8px; }
  }
  @media (max-width: 640px) {
    body { padding: 6px; }
    nav { flex-wrap: wrap; }
    .nav-hamburger { display: flex; }
    .nav-links {
      display: none !important; position: absolute; top: 100%; left: -2px; right: -2px;
      background: var(--white); flex-direction: column !important; border: var(--border); z-index: 250;
    }
    nav.nav-open .nav-links { display: flex !important; }
    .nav-item { width: 100%; }
    .nav-item > a {
      padding: 16px 22px !important; font-size: 10px !important;
      border-right: none !important; border-bottom: var(--border) !important; height: auto !important;
    }
    .dropdown-wrap {
      position: static !important; width: auto !important;
      max-height: 0 !important; overflow: hidden !important; transition: max-height 0.35s ease !important;
    }
    .dropdown-wrap.mob-open { max-height: 700px !important; overflow: visible !important; }
    .dropdown { border: none !important; }
    .dropdown a { padding-left: 36px !important; }
    .flyout { position: static !important; width: auto !important; clip-path: none !important; display: none; border: none !important; }
    .flyout-item.mob-open > .flyout { display: block; pointer-events: all; }
    .flyout a { padding-left: 52px !important; }
    .flyout a:last-child { border-bottom: var(--border) !important; }
    .flyout-trigger { border-bottom: var(--border) !important; }
    .nav-item:last-child > a { border-bottom: none !important; }
  }

  .macro-cover {
    display: flex; flex-direction: column; align-items: center; text-align: center;

  }

  .macro-lines--moire {
    opacity: var(--moire-opacity);
    animation: macroMoireTurn 420s linear infinite;
    will-change: transform;
  }
  @keyframes macroMoireTurn {
    from { transform: translate3d(var(--moire-x), var(--moire-y), 0) rotate(var(--moire-start)) scale(1.006); }
    to   { transform: translate3d(var(--moire-x), var(--moire-y), 0) rotate(calc(var(--moire-start) + 360deg)) scale(1.006); }
  }
  @media (prefers-reduced-motion: reduce) {
    .macro-lines--moire { animation-duration: 1200s; }
  }
  .macro-title {
    font-family: 'Observer Sharp', 'Gill Sans', 'Gill Sans MT', sans-serif;
    font-weight: normal; line-height: 1;
    font-size: clamp(24px, 5.6vmin, 64px);
    font-size: clamp(24px, min(6.9cqh, 9cqw), 64px);
    /* letter-spacing as macrotonal.org; the smaller indent evens Sharp's M and O sidebearings */
    letter-spacing: .16em; text-indent: .10em;
    text-transform: uppercase; white-space: nowrap;
    color: #efe7d2;
    margin-bottom: clamp(8px, 2cqh, 18px);
  }
  .macro-composer {
    font-family: 'Observer Sharp Book', 'Gill Sans', 'Gill Sans MT', sans-serif;
    font-size: clamp(9px, 1.45cqh, 11px);
    letter-spacing: .42em; text-indent: .42em;
    line-height: 1; text-transform: uppercase; white-space: nowrap;
    margin-bottom: clamp(10px, 2.6cqh, 22px);
  }
  /* the cover's reversed-out label */
  .macro-label {
    display: inline-block;
    background: #efe7d2; color: #33402f;
    font-family: 'Observer Sharp Book', 'Gill Sans', 'Gill Sans MT', sans-serif;
    font-size: clamp(9px, 1.3vmin, 12px);
    font-size: clamp(9px, min(1.6cqh, 3cqw), 12px);
    letter-spacing: .3em; text-indent: .3em;
    line-height: 1; text-transform: uppercase; white-space: nowrap;
    padding: .75em 1.33em .67em;
  }
  @media (max-width: 480px) {
    .macro-label { letter-spacing: .2em; text-indent: .2em; padding: .8em 1.2em .7em; }
  }
  /* the funder's logo, small at the foot of the card and out of the lockup's flow, so
     the cover stays where it was (Sam 2026-11-02, as on macrotonal.org) */
  .macro-funder {
    position: absolute; left: 50%; bottom: clamp(12px, 4.5cqh, 44px); transform: translateX(-50%);
    display: block; line-height: 0; opacity: .9; transition: opacity .15s;
  }
  .macro-funder:hover { opacity: 1; }
  .macro-funder img { display: block; height: clamp(26px, 6.2cqh, 60px); width: auto; }

  /* ── the surround: a marbling bath behind the card, in the colours of Sam's stone
     paper; only the strips round the card are drawn (the engine's CFG.frame). Its
     own colour is what shows before the paint comes in, or without WebGL. */
  /* not position:fixed: iOS 26 Safari paints its status bar and toolbar one solid colour
     when a fixed layer touches the screen's edges (its own or the root's background); the
     page never scrolls, so an ordinary layer stays put and Safari can show it under its
     bars. 100lvh is the screen's height with Safari's bars put away, so it reaches under
     them (on a desktop it is just the window). */
  .frame-bath { position: absolute; top: 0; left: 0; right: 0; height: 100%; height: 100lvh;
    z-index: -1; pointer-events: none; }
  #marble-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* the rollover is the cover green with cream type */
  .nav-item > a:hover, .dropdown a:hover, .flyout-trigger:hover, .flyout a:hover { background: #33402f; color: #efe7d2; }
  /* with the marbling running (its script adds .marble-menu) the rollover is the marbling
     itself: a canvas behind the label, which the script fills from the bath */
  .marble-menu :is(.nav-item > a, .dropdown a, .flyout-trigger, .flyout a) { position: relative; isolation: isolate; }
  .marble-menu :is(.nav-item > a, .dropdown a, .flyout-trigger, .flyout a):hover { background: transparent;
    text-shadow: 0 0 2px rgba(0,0,0,.65), 0 0 7px rgba(0,0,0,.5); }   /* the label reads on pale paint too */
  /* while the marbling runs, the card is see-through: the bath draws its shadow there */
  .marble-plate .site-wrap, .marble-plate .macro-page { background: none; }
  /* and the body: its colour moves to the root (the script sets it from the paint along
     the top edge, for Safari's status bar), or the body would paint it over the bath */
  .marble-plate body { background: none; }
  /* iOS 26 Safari fades the page into the root's colour under its status bar and address
     bar. The marbling's top-edge colour washed the edges yellow, near-black was a shadow;
     with no colour at all the fade is gone (Sam's iPhone, 2026-10-23), so none */
  .marble-plate { background-color: transparent; }
  /* the canvas runs 1px past the item inside a span that clips at the item's inner edge,
     so whatever pixel the item's border snaps to, the paint meets it (no white hairline) */
  .peek { position: absolute; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; display: none; }
  .peek canvas { position: absolute; left: -1px; top: -1px; width: calc(100% + 2px); height: calc(100% + 2px); }
  .marble-menu :is(.nav-item > a, .dropdown a, .flyout-trigger, .flyout a):hover > .peek { display: block; }

  /* a press is the marbling's (tap: a drop, hold: pour, drag: stir), so it never starts a
     text selection or raises the iOS callout; nothing on this page needs selecting.
     A drag on the card stirs the paint instead of panning the page. */
  html, body, body * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .macro-page { touch-action: none; }

  /* the iPhone (Sam): the page runs under Safari's status bar and floating address bar
     (viewport-fit=cover in the head), so the marbling shows there instead of a slate band;
     the card keeps clear of them by the safe-area insets. The small viewport (svh) is the
     height with Safari's bars showing; on a desktop it is just the window. */
  :root { --pad: 12px; --bleed: 0px; }
  @media (max-width: 768px) { :root { --pad: 8px; } }
  @media (max-width: 640px) { :root { --pad: 6px; } }
  body { padding: calc(var(--pad) + var(--bleed) + env(safe-area-inset-top, 0px)) calc(var(--pad) + env(safe-area-inset-right, 0px))
                  calc(var(--pad) + env(safe-area-inset-bottom, 0px)) calc(var(--pad) + env(safe-area-inset-left, 0px)); }
  .site-wrap { height: calc(100vh - 24px); height: calc(100svh - 24px - env(safe-area-inset-top, 0px)); }

  /* iPhone only (.ios-bleed, set by a line of script in the head): iOS 26 Safari paints its
     status bar flat on a page that isn't scrolled at all, and shows the page there once it
     is (Sam's screenshot at 22:10: the address bar showed the marbling, the status bar
     stayed stone). So the page sits scrolled by --bleed, the card that much lower in the
     page, the marbling bled above it and a little below; one snap point brings it back. */
  .ios-bleed { --bleed: 64px; overflow-y: scroll; overscroll-behavior-y: none; scroll-snap-type: y mandatory; }
  .ios-bleed body { height: auto; min-height: calc(100lvh + var(--bleed)); overflow: visible; }
  .ios-bleed .frame-bath { height: calc(100lvh + var(--bleed) + 160px); }   /* 40px left a strip under the address bar (Sam, 22:20) */
  .bleed-snap { display: none; }
  .ios-bleed .bleed-snap { display: block; position: absolute; top: var(--bleed); left: 0; width: 1px; height: 1px;
    scroll-snap-align: start; pointer-events: none; }

<script>
/* .ios-bleed: open scrolled to the bleed; the snap point keeps it there */
(function(){
  var root = document.documentElement;
  if (!root.classList.contains('ios-bleed')) return;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  function settle(){
    var b = parseFloat(getComputedStyle(root).getPropertyValue('--bleed')) || 0;
    if (Math.abs(window.scrollY - b) > 1) window.scrollTo(0, b);
  }
  settle();
  window.addEventListener('load', settle);
  window.addEventListener('pageshow', settle);
  window.addEventListener('orientationchange', function(){ setTimeout(settle, 300); });
})();
</script>

<script>
(function() {
  function syncMenuWidths() {
    var items = document.querySelectorAll('.nav-links .nav-item');
    if (items.length < 3) return;
    var projW = items[1].getBoundingClientRect().width;
    var bandW = items[2].getBoundingClientRect().width;
    document.documentElement.style.setProperty('--dropdown-w', projW + 'px');
    document.documentElement.style.setProperty('--flyout-w',   bandW + 'px');
  }
  syncMenuWidths();
  window.addEventListener('resize', syncMenuWidths);
})();

(function() {
  var nav    = document.querySelector('nav');
  var burger = document.querySelector('.nav-hamburger');
  if (!burger || !nav) return;
  burger.addEventListener('click', function(e) {
    e.stopPropagation();
    var isOpen = nav.classList.toggle('nav-open');
    burger.setAttribute('aria-expanded', String(isOpen));
  });
  var ddWrap = document.querySelector('.dropdown-wrap');
  if (ddWrap) {
    var ddItem = ddWrap.closest('.nav-item');
    var ddLink = ddItem ? ddItem.querySelector(':scope > a') : null;
    if (ddLink) {
      ddLink.addEventListener('click', function(e) {
        if (window.innerWidth <= 640) {
          e.preventDefault(); e.stopPropagation();
          ddWrap.classList.toggle('mob-open');
        }
      });
    }
  }
  document.querySelectorAll('.flyout-item').forEach(function(fi) {
    var trigger = fi.querySelector('.flyout-trigger');
    var flyout  = fi.querySelector('.flyout');
    if (trigger && flyout) {
      trigger.addEventListener('click', function(e) {
        if (window.innerWidth <= 640) {
          e.preventDefault(); e.stopPropagation();
          fi.classList.toggle('mob-open');
        }
      });
    }
  });
  document.addEventListener('click', function(e) {
    if (!nav.contains(e.target)) {
      nav.classList.remove('nav-open');
      burger.setAttribute('aria-expanded', 'false');
    }
  });
  document.querySelectorAll('.nav-links a').forEach(function(a) {
    if (a.getAttribute('href') !== '#') {
      a.addEventListener('click', function() {
        nav.classList.remove('nav-open');
        burger.setAttribute('aria-expanded', 'false');
      });
    }
  });
})();

(function() {
  var page = document.querySelector('.macro-page');
  var graphic = document.querySelector('.macro-graphic');
  if (!page || !graphic) return;

  function buildLineLayer(className) {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    var center = 500, innerRadius = 108, outerRadius = 432, spokes = 60;
    svg.setAttribute('class', 'macro-lines ' + className);
    svg.setAttribute('viewBox', '0 0 1000 1000');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    for (var i = 0; i < spokes; i += 1) {
      var angle = ((i / spokes) * Math.PI * 2) - (Math.PI / 2);
      var line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', String(center + Math.cos(angle) * innerRadius));
      line.setAttribute('y1', String(center + Math.sin(angle) * innerRadius));
      line.setAttribute('x2', String(center + Math.cos(angle) * outerRadius));
      line.setAttribute('y2', String(center + Math.sin(angle) * outerRadius));
      svg.appendChild(line);
    }
    var core = document.createElementNS(ns, 'circle');
    core.setAttribute('cx', String(center));
    core.setAttribute('cy', String(center));
    core.setAttribute('r', '109');
    svg.appendChild(core);
    return svg;
  }

  if (!graphic.querySelector('.macro-lines')) {
    graphic.appendChild(buildLineLayer('macro-lines--still'));
    graphic.appendChild(buildLineLayer('macro-lines--moire'));
  }

  function setInterference(clientX, clientY) {
    var rect = page.getBoundingClientRect();
    var x = ((clientX - rect.left) / rect.width) - 0.5;
    var y = ((clientY - rect.top) / rect.height) - 0.5;
    graphic.style.setProperty('--moire-x', (x * 7).toFixed(2) + 'px');
    graphic.style.setProperty('--moire-y', (y * 7).toFixed(2) + 'px');
    graphic.style.setProperty('--moire-start', (x * 0.45).toFixed(3) + 'deg');
    graphic.style.setProperty('--moire-opacity', '1');
  }
  function resetInterference() {
    graphic.style.setProperty('--moire-x', '0px');
    graphic.style.setProperty('--moire-y', '0px');
    graphic.style.setProperty('--moire-start', '0deg');
    graphic.style.setProperty('--moire-opacity', '1');
  }
  page.addEventListener('pointermove', function(e){ setInterference(e.clientX, e.clientY); }, { passive: true });
  page.addEventListener('pointerdown', function(e){ setInterference(e.clientX, e.clientY); }, { passive: true });
  page.addEventListener('pointerleave', resetInterference);
})();
</script>

<script>
/* Marbling — round and under the macro card (2026-10-23): the same marbling as the
   home, mastering and contact pages, in the colours of Sam's stone-pattern paper, round
   the card; under it the same paint as a dark shadow in the card's green. Presses work
   through the card but not the menus, whose rollover shows the paint in colour.
   Source: ~/Development/MacrotonalRestyle (samannand_macro.py, samannand/marble/engine.js,
   a copy of ~/Development/MarbleBath/engine.js with the CFG.frame additions). */

const CFG = {"optics":"flat","plate":"#3f5d77","palettes":[{"name":"stone paper","ink":["#c4bead","#23211f","#e9b650","#cd4636","#e3ddcc","#3f5d77"]}],"share":[0.24,0.12,0.16,0.12,0.1,0.26],"ground":5,"deal":true,"hot":0,"vig":0,"shade":0.35,"grain":0.012,"instant":true,"fade":0.25,"frame":".site-wrap","reveal":".nav-item > a:hover, .dropdown a:hover, .flyout-trigger:hover, .flyout a:hover","shadow":{"base":"#33402f","lo":0.6,"hi":1.35,"grain":0.055},"noInput":"nav, .macro-funder","edgeBias":0.5};
const cv = document.getElementById('marble-canvas');
if (!cv) return;

/* Engine body. build.py wraps this in an IIFE that defines CFG (the page's
   palettes and look) and cv (the #marble-canvas element).

   samannand.net/macro/ copy (2026-10-23): ~/Development/MarbleBath/engine.js as
   of 20:50 that day (engine.upstream.js beside this file) plus one opt-in
   addition, CFG.frame: the bath lies behind a card (that selector) and shows
   only round it. Then only those strips are drawn, the pointer works only
   there, and the marbler's drops, strokes and eddies keep to the card's edge,
   where they show. With it, CFG.reveal (a selector) names elements on the card
   to paint behind as well, and MARBLE.onFrame(canvas) runs after each frame
   so the page can copy that paint into them (the macro menu's rollover).
   CFG.shadow {base, lo, hi, grain, inset, invert} draws the card as well, as smoked glass in
   its own colour: the same paint under it as a dark shadow (the page makes the
   card see-through while the marbling runs).
   Without CFG.frame it is the upstream engine, frame for frame. */

const host = cv.parentElement;
const frameEl = CFG.frame ? document.querySelector(CFG.frame) : null;
/* load timeline (ms since navigation), for QA */
const TIMING = {script: Math.round(performance.now()), bands: 0};
const gl = cv.getContext('webgl2', {alpha:false, antialias:false, depth:false,
                                    stencil:false, preserveDrawingBuffer:false});
if (!gl){ cv.style.display = 'none'; return; }   // the panel keeps its plain colour
const reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
const reduced = !!(reduceQ && reduceQ.matches);
const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
const TAU = Math.PI * 2;
/* Up to four inks ride in one RGBA8 texel (three fractions + film thickness,
   the last ink is whatever is left); a page with more adds a second texel.
   'flat' optics paint each ink in its exact colour; otherwise colour runs
   through Liquid Light IV's lamp-and-absorption optics. */
const FLAT = CFG.optics === 'flat';
const NINK = FLAT ? CFG.palettes[0].ink.length : 4;
const MULTI = NINK > 4;
/* CFG.shadow (with CFG.frame, flat optics): the card is drawn too, as if it
   were smoked glass in its own colour over the bath — the same paint under
   it as a dark shadow, each ink the card's colour scaled by its lightness
   (lo for black, hi for white), with the card's static grain */
const SHADOW = FLAT && !!(CFG.frame && CFG.shadow);

/* The flow map needs float render targets. Without them the plate still
   marbles by drops (those need no map), just without strokes and eddies. */
const hasCBF = !!gl.getExtension('EXT_color_buffer_float');
const aniso = gl.getExtension('EXT_texture_filter_anisotropic') ||
              gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
const maxAniso = aniso ? gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 1;

const ND = 24;      // drops still spreading since the last bake
const NS = 12;      // stylus tips (a comb is several)
const NV = CFG.nv || 3;   // slow eddies (CFG.nv: a zoomed-out still needs many more to stir it)
const NOPS = CFG.nops || 320;   // operations in the opening composition
/* CFG.detail: zoomed out by this much, for print stills: the bath is that many times
   larger in the same frame, so drops, eddies and flow all come out finer (give it
   CFG.nops ~ 320 x detail^2, the opening needs that many more drops to cover it) */
const DETAIL = CFG.detail || 1;
const MARG = 0.14;  // world margin round the visible plate; eddies circulate through it
const REF_CAP = CFG.refCap || (coarse ? 2048 : 2560);   // reference texture's long side, device px (CFG.refCap: print stills)
const MAP_CAP = CFG.mapCap || (coarse ? 640 : 1024);   // the flow map (CFG.mapCap: zoomed-out print stills)

/* ══ SHADERS ═══════════════════════════════════════════════════════════ */

const HDR = `#version 300 es
#define INKS ${NINK}
${MULTI ? '#define MULTI 1' : ''}
${FLAT ? '#define FLAT 1' : ''}${SHADOW ? '\n#define SHADOW 1' : ''}
precision highp float;
precision highp int;
precision highp sampler2D;
`;

const VS = `#version 300 es
layout(location = 0) in vec2 a;
out vec2 vUv;
void main(){ vUv = a * 0.5 + 0.5; gl_Position = vec4(a, 0.0, 1.0); }`;

const DOMAIN = `
uniform vec2  uVis;    // visible plate in world units (its area is 1)
uniform vec2  uDom;    // whole domain, margins included
uniform float uMarg;
vec2 domUV(vec2 w){ return (w + uMarg) / uDom; }
vec2 domW(vec2 uv){ return uv * uDom - uMarg; }`;

const NOISE = `
vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x){ return mod289(((x * 34.0) + 10.0) * x); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m; m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x  = a0.x  * x0.x   + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}
/* an integer hash of the lattice cell (pcg2d, Jarzynski & Olano 2020): the old
   fract-multiply hash wove a visible lattice into the grain (Sam 2026-10-24) */
float h21(vec2 p){
  uvec2 v = uvec2(ivec2(floor(p)) + 65536);
  v = v * 1664525u + 1013904223u;
  v.x += v.y * 1664525u; v.y += v.x * 1664525u;
  v ^= v >> 16u;
  v.x += v.y * 1664525u; v.y += v.x * 1664525u;
  v ^= v >> 16u;
  return float(v.x ^ v.y) * (1.0 / 4294967296.0);
}
/* smooth value noise, for the grain's softer layers */
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x),
             mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
}
/* card grain, about -0.5..0.5, fixed to the screen: a fine speckle in device pixels, a
   softer grain of a couple of css px, and a faint slow mottle, as in real card stock */
float paperGrain(vec2 fc, float dpr){
  vec2 c = fc / dpr;
  float fine = h21(fc + 17.0) - 0.5;
  float soft = vn(c * 0.55 + 31.0) - 0.5;
  float mott = vn(c * 0.035 + 97.0) - 0.5 + 0.5 * (vn(c * 0.011 + 5.0) - 0.5);
  return 0.62 * fine + 0.75 * soft + 0.55 * mott;
}`;

/* Paint is ink fractions plus film thickness: three fractions and the
   thickness in one texel (a), four more fractions in a second (b) when a page
   has more than four inks. The last ink is whatever is left, so filtering
   always keeps the fractions a true partition. */
const INK = `
void addPaint(inout vec4 acc, inout vec4 accB, float w, int k, float h){
  bool last = k >= INKS - 1;
  acc += w * vec4(last ? vec3(0.0) : vec3(equal(ivec3(k), ivec3(0, 1, 2))), h);
  accB += w * (last ? vec4(0.0) : vec4(equal(ivec4(k), ivec4(3, 4, 5, 6))));
}
/* film thickness inside a drop, by when the paint came out: q = 0 is the
   first paint (now riding the rim), q = 1 the last (the centre). Spreading
   stretches paint round the circle, so its texture runs in concentric bands
   with only slow variation around the ring. */
float hDrop(float q, vec2 dir, float seed){
  float bands = snoise(vec2(q * 6.5 + seed * 17.0, seed * 3.1));
  float fine  = snoise(vec2(q * 21.0 - seed * 5.0, seed * 7.7 + 2.0));
  float azim  = snoise(dir * 1.3 + vec2(seed * 9.0, q * 2.2));
  float h = 0.5 + 0.075 * bands + 0.03 * fine + 0.05 * azim;
  h += 0.09 * exp(-q * 16.0);            // tideline: the first paint out is thickest
  return clamp(h, 0.02, 0.98);
}
float hGround(vec2 p){
  return clamp(0.5 + 0.07 * snoise(p * 4.0) + 0.035 * snoise(p * 11.0 + 5.3), 0.02, 0.98);
}`;

/* Slow eddies (rigid-cored rotation with a gaussian falloff) plus stylus
   tips. A tip is a divergence-free dipole: paint within its core moves with
   it, paint further out slides round its sides — the wake a stylus leaves. */
const VEL = `
uniform vec4 uVort[${NV}];   // centre xy, angular speed (rad/s), radius
uniform vec4 uStyP[${NS}];   // tip xy, tip velocity xy
uniform vec4 uStyB[${NS}];   // core radius (0 = lifted), unused x3
vec2 vel(vec2 w){
  vec2 v = vec2(0.0);
  for (int i = 0; i < ${NV}; i++){
    vec4 q = uVort[i];
    if (q.z == 0.0) continue;
    vec2 r = w - q.xy;
    v += q.z * exp(-dot(r, r) / (q.w * q.w)) * vec2(-r.y, r.x);
  }
  for (int j = 0; j < ${NS}; j++){
    float sg = uStyB[j].x;
    if (sg <= 0.0) continue;
    vec2 r = w - uStyP[j].xy;
    vec2 V = uStyP[j].zw;
    float s2 = sg * sg;
    float k = s2 / (s2 + dot(r, r));
    float cr = V.x * r.y - V.y * r.x;
    v += k * V + (2.0 * k * k / s2) * cr * vec2(-r.y, r.x);
  }
  return v;
}`;

/* the map is RG32F (half floats wander by a pixel within seconds), read
   with a manual bilinear because float filtering is optional on phones */
const MAPREAD = `
uniform sampler2D uMap;      // backward displacement since the last bake
vec2 mapAt(vec2 uv){
  vec2 ts = vec2(textureSize(uMap, 0));
  vec2 sp = uv * ts - 0.5;
  vec2 i = floor(sp), f = sp - i;
  ivec2 a = ivec2(clamp(i, vec2(0.0), ts - 1.0));
  ivec2 b = ivec2(clamp(i + 1.0, vec2(0.0), ts - 1.0));
  vec2 p00 = texelFetch(uMap, a, 0).xy;
  vec2 p10 = texelFetch(uMap, ivec2(b.x, a.y), 0).xy;
  vec2 p01 = texelFetch(uMap, ivec2(a.x, b.y), 0).xy;
  vec2 p11 = texelFetch(uMap, b, 0).xy;
  return mix(mix(p00, p10, f.x), mix(p01, p11, f.x), f.y);
}`;

/* Undo the drops spreading since the last bake, newest first. This is
   Jaffer & Lu's exact marbling map inverted: a drop of radius r pushes
   every point at distance d out to sqrt(d²+r²), so looking backwards a
   point slides toward the centre and paint just outside a drop comes from a
   sliver squeezed thin — the fine rings and veins marbling is known for.
   J carries d(position)/d(screen) through each step so every edge, however
   hard it has been squeezed, is antialiased analytically. */
const CHAIN = `
uniform vec4 uDrop[${ND}];    // centre xy (bake space), r² − b² still to push, size scale
uniform vec4 uDropB[${ND}];   // ink, seed, current radius, unused
uniform int  uNDrop;
void undoDrops(inout vec2 p, inout mat2 J, float pxw, inout vec4 acc, inout vec4 accB, inout float rem){
  for (int i = ${ND} - 1; i >= 0; i--){
    if (i >= uNDrop) continue;
    vec4 d = uDrop[i];
    if (d.z <= 0.0) continue;
    vec2 r = p - d.xy;
    float dist = length(r);
    vec2 rh = dist > 1e-7 ? r / dist : vec2(1.0, 0.0);
    float s = sqrt(d.z);
    float gpx = max(length(transpose(J) * rh) * pxw, 1e-7);
    float cov = clamp((s - dist) / gpx + 0.5, 0.0, 1.0);
    if (cov > 0.0){
      vec4 e = uDropB[i];
      float rho = sqrt(max(e.z * e.z - dist * dist, 0.0));
      addPaint(acc, accB, rem * cov, int(e.x + 0.5), hDrop(rho / d.w, rh, e.y));
      rem *= 1.0 - cov;
    }
    /* carry on from the middle of the pixel's outside part, not its edge */
    float de = max(max(dist, 0.5 * (s + dist + 0.5 * gpx)), s * 1.0002);
    vec2 rr = rh * de;
    float kk = sqrt(max(1.0 - d.z / (de * de), 1e-6));
    p = d.xy + rr * kk;
    J = (mat2(kk) + (d.z / (kk * de * de * de * de)) * outerProduct(rr, rr)) * J;
  }
}`;

/* flow map step: RK2 backtrace, then carry the old displacement along */
const FS_MAP = HDR + DOMAIN + VEL + MAPREAD + `
uniform float uDt;
in vec2 vUv;
out vec4 o;
void main(){
  vec2 w = domW(vUv);
  vec2 wb = w - uDt * vel(w - 0.5 * uDt * vel(w));
  o = vec4(wb + mapAt(domUV(wb)) - w, 0.0, 1.0);
}`;

/* The opening composition: every texel runs back through the whole history
   of operations — dozens of drops, a rake, the eddies' first turns — with
   exact inverse maps, so the page opens on paint that has already been
   worked rather than on fresh blobs. */
const FS_BOOT = HDR + DOMAIN + NOISE + INK + `
uniform sampler2D uOps;      // RGBA32F, two texels per operation, oldest first
uniform int   uNOps, uGround;
uniform float uPxW;
in vec2 vUv;
layout(location = 0) out vec4 o;
#ifdef MULTI
layout(location = 1) out vec4 o1;
#endif
void history(vec2 p, float pxw, out vec4 acc, out vec4 accB){
  mat2 J = mat2(1.0);
  acc = vec4(0.0);
  accB = vec4(0.0);
  float rem = 1.0;
  for (int k = uNOps - 1; k >= 0; k--){
    vec4 A = texelFetch(uOps, ivec2(2 * k, 0), 0);
    vec4 B = texelFetch(uOps, ivec2(2 * k + 1, 0), 0);
    if (A.x < 0.5){                       // drop: centre A.yz, radius A.w
      vec2 r = p - A.yz;
      float dist = length(r);
      vec2 rh = dist > 1e-7 ? r / dist : vec2(1.0, 0.0);
      float R = A.w;
      float gpx = max(length(transpose(J) * rh) * pxw, 1e-7);
      float cov = clamp((R - dist) / gpx + 0.5, 0.0, 1.0);
      if (cov > 0.0){
        float rho = sqrt(max(R * R - dist * dist, 0.0));
        addPaint(acc, accB, rem * cov, int(B.x + 0.5), hDrop(rho / R, rh, B.y));
        rem *= 1.0 - cov;
        if (rem < 0.002) break;
      }
      float de = max(max(dist, 0.5 * (R + dist + 0.5 * gpx)), R * 1.0002);
      vec2 rr = rh * de;
      float kk = sqrt(max(1.0 - R * R / (de * de), 1e-6));
      p = A.yz + rr * kk;
      J = (mat2(kk) + (R * R / (kk * de * de * de * de)) * outerProduct(rr, rr)) * J;
    } else if (A.x < 1.5){                // swirl: centre A.yz, turn A.w, radius B.x
      vec2 r = p - A.yz;
      float e = exp(-dot(r, r) / (B.x * B.x));
      float ph = -A.w * e;
      float c = cos(ph), s = sin(ph);
      mat2 Rm = mat2(c, s, -s, c);
      vec2 rp = Rm * r;
      p = A.yz + rp;
      J = (Rm + outerProduct(vec2(-rp.y, rp.x), (2.0 * A.w * e / (B.x * B.x)) * r)) * J;
    } else {                              // rake: line through A.yz at angle A.w, shift B.x, falloff B.y
      vec2 M = vec2(cos(A.w), sin(A.w));
      vec2 N = vec2(-M.y, M.x);
      float sd = dot(p - A.yz, N);
      float ad = sqrt(sd * sd + 2.5e-5);  // the tine has a width: no hard kink on its line
      float dl = ad + B.y;
      p -= M * (B.x * B.y / dl);
      J = (mat2(1.0) + outerProduct(M, (B.x * B.y / (dl * dl)) * (sd / ad) * N)) * J;
    }
  }
  if (rem > 0.002) addPaint(acc, accB, rem, uGround, hGround(p));
}
/* the analytic edge coverage handles ordinary edges; extra samples average
   rings squeezed thinner than a texel */
uniform int uSS;
void main(){
  vec2 q = domW(vUv);
  float e = uPxW;
  vec4 a = vec4(0.0), b = vec4(0.0), a1, b1;
  if (uSS <= 1){
    history(q, e, a, b);
  } else if (uSS == 2){
    history(q + vec2(0.25, 0.25) * e, 0.7 * e, a1, b1); a += 0.5 * a1; b += 0.5 * b1;
    history(q - vec2(0.25, 0.25) * e, 0.7 * e, a1, b1); a += 0.5 * a1; b += 0.5 * b1;
  } else {
    history(q + vec2(-0.125, -0.375) * e, 0.5 * e, a1, b1); a += 0.25 * a1; b += 0.25 * b1;
    history(q + vec2( 0.375, -0.125) * e, 0.5 * e, a1, b1); a += 0.25 * a1; b += 0.25 * b1;
    history(q + vec2( 0.125,  0.375) * e, 0.5 * e, a1, b1); a += 0.25 * a1; b += 0.25 * b1;
    history(q + vec2(-0.375,  0.125) * e, 0.5 * e, a1, b1); a += 0.25 * a1; b += 0.25 * b1;
  }
  o = a;
#ifdef MULTI
  o1 = b;
#endif
}`;

/* Which operation's drop each point of the visible plate ends up inside
   (65535 = bare ground), point-sampled at low resolution, so the opening's
   colours can be dealt by how much of each drop is actually seen. */
const FS_BOOTID = HDR + DOMAIN + `
uniform sampler2D uOps;
uniform int uNOps;
in vec2 vUv;
out vec4 o;
void main(){
  vec2 p = vUv * uVis;
  int hit = 65535;
  for (int k = uNOps - 1; k >= 0; k--){
    vec4 A = texelFetch(uOps, ivec2(2 * k, 0), 0);
    vec4 B = texelFetch(uOps, ivec2(2 * k + 1, 0), 0);
    if (A.x < 0.5){
      vec2 r = p - A.yz;
      float dd = dot(r, r), R2 = A.w * A.w;
      if (dd < R2){ hit = k; break; }
      p = A.yz + r * sqrt(1.0 - R2 / dd);
    } else if (A.x < 1.5){
      vec2 r = p - A.yz;
      float ph = -A.w * exp(-dot(r, r) / (B.x * B.x));
      float c = cos(ph), s = sin(ph);
      p = A.yz + mat2(c, s, -s, c) * r;
    } else {
      vec2 M = vec2(cos(A.w), sin(A.w)), N = vec2(-M.y, M.x);
      float sd = dot(p - A.yz, N);
      p -= M * (B.x * B.y / (sqrt(sd * sd + 2.5e-5) + B.y));
    }
  }
  o = vec4(float(hit & 255) / 255.0, float(hit >> 8) / 255.0, 0.0, 1.0);
}`;

/* Bake: fold the flow map and the spreading drops into a fresh reference.
   Clamped Catmull-Rom where paint has only drifted or turned (so edges do
   not soften bake after bake), mip/anisotropic filtering where the flow has
   squeezed it (so squeezed veins average instead of breaking into dots). */
const FS_BAKE = HDR + DOMAIN + NOISE + INK + MAPREAD + CHAIN + `
uniform sampler2D uRef;
#ifdef MULTI
uniform sampler2D uRefB;
#endif
uniform float uPxW, uHasMap, uCrisp;
in vec2 vUv;
layout(location = 0) out vec4 o;
#ifdef MULTI
layout(location = 1) out vec4 o1;
#endif
vec4 fetchC(sampler2D tex, ivec2 c, ivec2 n){ return texelFetch(tex, clamp(c, ivec2(0), n - 1), 0); }
vec4 sharp(sampler2D tex, vec2 uv, out vec4 mn, out vec4 mx){
  ivec2 n = textureSize(tex, 0);
  vec2 ts = vec2(n);
  vec2 sp = uv * ts;
  vec2 t1 = floor(sp - 0.5) + 0.5;
  vec2 f = sp - t1;
  vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f));
  vec2 w1 = 1.0 + f * f * (-2.5 + 1.5 * f);
  vec2 w2 = f * (0.5 + f * (2.0 - 1.5 * f));
  vec2 w3 = f * f * (-0.5 + 0.5 * f);
  vec2 w12 = w1 + w2;
  vec2 t0 = (t1 - 1.0) / ts, t3 = (t1 + 2.0) / ts, t12 = (t1 + w2 / w12) / ts;
  vec4 c = textureLod(tex, vec2(t0.x,  t0.y),  0.0) * w0.x  * w0.y
         + textureLod(tex, vec2(t12.x, t0.y),  0.0) * w12.x * w0.y
         + textureLod(tex, vec2(t3.x,  t0.y),  0.0) * w3.x  * w0.y
         + textureLod(tex, vec2(t0.x,  t12.y), 0.0) * w0.x  * w12.y
         + textureLod(tex, vec2(t12.x, t12.y), 0.0) * w12.x * w12.y
         + textureLod(tex, vec2(t3.x,  t12.y), 0.0) * w3.x  * w12.y
         + textureLod(tex, vec2(t0.x,  t3.y),  0.0) * w0.x  * w3.y
         + textureLod(tex, vec2(t12.x, t3.y),  0.0) * w12.x * w3.y
         + textureLod(tex, vec2(t3.x,  t3.y),  0.0) * w3.x  * w3.y;
  ivec2 b = ivec2(floor(sp - 0.5));
  vec4 q0 = fetchC(tex, b, n), q1 = fetchC(tex, b + ivec2(1, 0), n);
  vec4 q2 = fetchC(tex, b + ivec2(0, 1), n), q3 = fetchC(tex, b + ivec2(1, 1), n);
  mn = min(min(q0, q1), min(q2, q3));
  mx = max(max(q0, q1), max(q2, q3));
  return clamp(c, mn, mx);
}
vec4 sharp(sampler2D tex, vec2 uv){ vec4 mn, mx; return sharp(tex, uv, mn, mx); }
/* Area-preserving flow squeezes paint one way while stretching it the other,
   so between bakes nearly every texel's footprint is a little long in one
   direction. Averaging a few sharp taps along that long axis keeps edges
   crisp bake after bake; only hard-squeezed paint (veins) goes to the mips. */
vec4 bakeSample(sampler2D tex, vec2 uv, vec2 gx, vec2 gy, vec4 frac){
  vec2 ts = vec2(textureSize(tex, 0));
  vec2 ax = gx * ts, ay = gy * ts;            // footprint axes, in texels
  float m11 = ax.x * ax.x + ay.x * ay.x;
  float m22 = ax.y * ax.y + ay.y * ay.y;
  float m12 = ax.x * ax.y + ay.x * ay.y;
  float hm = 0.5 * (m11 + m22);
  float l1 = hm + sqrt(max(hm * hm - (m11 * m22 - m12 * m12), 0.0));
  float fmaj = sqrt(l1);
  if (fmaj <= 1.25){
    /* Paint squeezed below a texel is averaged; if the flow later stretches
       it out again the edge comes back soft. A gentle anti-diffusion, held
       inside the local min/max so it can never invent paint or thicken a
       thin vein, lets such edges slowly settle crisp again. */
    vec4 mn, mx;
    vec4 c = sharp(tex, uv, mn, mx);
    vec2 tx = 1.0 / ts;
    vec4 nb = 0.25 * (textureLod(tex, uv + vec2(tx.x, 0.0), 0.0) + textureLod(tex, uv - vec2(tx.x, 0.0), 0.0)
                    + textureLod(tex, uv + vec2(0.0, tx.y), 0.0) + textureLod(tex, uv - vec2(0.0, tx.y), 0.0));
    /* only on edges that have gone soft: crisp ones are left alone, or they
       would be pushed into one-texel stairs; only fraction channels (frac),
       never the thickness */
    vec4 soft = 1.0 - smoothstep(0.3, 0.7, mx - mn);
    return mix(c, clamp(c + uCrisp * soft * (c - nb), mn, mx), frac);
  }
  if (fmaj > 6.0) return textureGrad(tex, uv, gx, gy);
  vec2 v = abs(m12) > 1e-9 ? normalize(vec2(l1 - m22, m12))
                           : (m11 >= m22 ? vec2(1.0, 0.0) : vec2(0.0, 1.0));
  vec2 span = v * fmaj / ts;
  int n = int(ceil(fmaj));
  vec4 sum = vec4(0.0);
  for (int i = 0; i < 6; i++){
    if (i >= n) break;
    sum += sharp(tex, uv + span * ((float(i) + 0.5) / float(n) - 0.5));
  }
  return sum / float(n);
}
void main(){
  vec2 p = domW(vUv) + mapAt(vUv) * uHasMap;
  mat2 J = mat2(dFdx(p), dFdy(p)) / uPxW;
  vec4 acc = vec4(0.0), accB = vec4(0.0);
  float rem = 1.0;
  undoDrops(p, J, uPxW, acc, accB, rem);
  vec4 s = vec4(0.0), sB = vec4(0.0);
  if (rem > 1e-4){
    vec2 uv = domUV(p), gx = J * vec2(uPxW, 0.0) / uDom, gy = J * vec2(0.0, uPxW) / uDom;
    s = bakeSample(uRef, uv, gx, gy, vec4(1.0, 1.0, 1.0, 0.0));
#ifdef MULTI
    sB = bakeSample(uRefB, uv, gx, gy, vec4(1.0));
#endif
  }
  vec4 F = acc + rem * s, FB = accB + rem * sB;
  float tot = F.x + F.y + F.z + FB.x + FB.y + FB.z + FB.w;
  if (tot > 1.0){ F.xyz /= tot; FB /= tot; }
  o = F;
#ifdef MULTI
  o1 = FB;
#endif
}`;

/* Composite. The colour path is Liquid Light IV's optics unchanged — a warm
   centre-hot lamp through Beer-Lambert inks over a fixed base tint — so the
   page palettes stay exactly as tuned. Sub-pixel filaments average their
   transmitted light, as a lens would. */
const FS_COMP = HDR + DOMAIN + NOISE + INK + MAPREAD + CHAIN + `
uniform sampler2D uRef;
#ifdef MULTI
uniform sampler2D uRefB;
#endif
uniform float uPxW, uHasMap;
uniform vec3  uAb0, uAb1, uAb2, uAb3, uLamp, uBase, uPlate;
uniform vec3  uInk[8];        // flat optics: each ink's colour, linear light
uniform float uHot, uVig, uCreamLo, uCreamAmt, uGrain, uSeedT, uDpr, uFade, uShade;
#ifdef SHADOW
uniform vec3  uInkS[8], uPlateS;   // the shadow's inks (linear) and the card's colour (sRGB)
uniform vec4  uSRect;              // the card, device px from the bottom left: centre, half size
uniform float uSRad, uSOn, uGrainS, uSInv;   // uSInv: the shadow outside the card instead
#endif
in vec2 vUv;
out vec4 o;
void main(){
  vec2 w = vUv * uVis;
  vec2 p = w + mapAt(domUV(w)) * uHasMap;
  mat2 J = mat2(dFdx(p), dFdy(p)) / uPxW;
  vec4 acc = vec4(0.0), accB = vec4(0.0);
  float rem = 1.0;
  undoDrops(p, J, uPxW, acc, accB, rem);
  vec4 s = vec4(0.0), sB = vec4(0.0);
  if (rem > 1e-4){
    vec2 uv = domUV(p), gx = J * vec2(uPxW, 0.0) / uDom, gy = J * vec2(0.0, uPxW) / uDom;
    s = textureGrad(uRef, uv, gx, gy);
#ifdef MULTI
    sB = textureGrad(uRefB, uv, gx, gy);
#endif
  }
  vec4 F = acc + rem * s, FB = accB + rem * sB;
  float rest = max(1.0 - F.x - F.y - F.z - FB.x - FB.y - FB.z - FB.w, 0.0);
  vec2 hp = (vUv - 0.5) * vec2(uVis.x / uVis.y, 1.0);
  float hot = 1.0 - uHot * smoothstep(0.18, 1.05, length(hp));
  vec2 vp = (vUv - 0.5 + vec2(0.02, -0.015)) * vec2(uVis.x / uVis.y, 1.0);
#ifdef FLAT
  /* each ink in its own flat colour, mixed by coverage in linear light (as
     an eye would average a filament finer than a pixel); a thicker film
     reads a touch deeper, a thinner one a touch lighter */
  vec3 lin = F.x * uInk[0] + F.y * uInk[1] + F.z * uInk[2]
           + FB.x * uInk[3] + FB.y * uInk[4] + FB.z * uInk[5] + FB.w * uInk[6]
           + rest * uInk[INKS - 1];
  lin *= exp(-uShade * (F.w - 0.5)) * hot;
  lin *= 1.0 - uVig * smoothstep(0.34, 1.1, length(vp));
  vec3 col = mix(lin * 12.92, 1.055 * pow(lin, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, lin));
#else
  vec4 f = vec4(F.xyz, rest);
  float dens = 0.75 * (0.5 + F.w);

  vec3 lamp = uLamp * hot;
  float k = dens * 1.9;
  vec3 trans = (f.x * exp(-k * uAb0) + f.y * exp(-k * uAb1)
              + f.z * exp(-k * uAb2) + f.w * exp(-k * uAb3)) * exp(-uBase);
  vec3 col = lamp * trans;
  float lu = dot(col, vec3(0.299, 0.587, 0.114));
  col = clamp(mix(vec3(lu), col, 1.18), 0.0, 4.0);
  col = vec3(1.0) - exp(-col * 2.6);
  float lum = max(max(col.r, col.g), col.b);
  col = mix(col, vec3(1.0, 0.968, 0.90) * lum, smoothstep(uCreamLo, 1.0, lum) * uCreamAmt);
  col *= 1.0 - uVig * smoothstep(0.34, 1.1, length(vp));
#endif
  col += paperGrain(gl_FragCoord.xy, uDpr) * uGrain;   // still, like paper (it used to boil in 1.6 px squares)
  col = mix(uPlate, col, uFade);
#ifdef SHADOW
  /* under the card: the same paint as a shadow in the card's colour, with a
     grain that stays put. The card's rounded edge, which its border covers,
     divides the two. */
  if (uSOn > 0.5){
    vec2 qd = abs(gl_FragCoord.xy - uSRect.xy) - uSRect.zw + uSRad;
    float inS = clamp(0.5 - (length(max(qd, 0.0)) + min(max(qd.x, qd.y), 0.0) - uSRad), 0.0, 1.0);
    if (uSInv > 0.5) inS = 1.0 - inS;
    if (inS > 0.0){
      vec3 ls = F.x * uInkS[0] + F.y * uInkS[1] + F.z * uInkS[2]
              + FB.x * uInkS[3] + FB.y * uInkS[4] + FB.z * uInkS[5] + FB.w * uInkS[6]
              + rest * uInkS[INKS - 1];
      ls *= exp(-uShade * (F.w - 0.5));
      vec3 cs = mix(ls * 12.92, 1.055 * pow(ls, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, ls));
      /* the grain after the fade, so a page fading the shadow in from its card opens
         on the same grained green, not a flat one */
      vec3 sh = mix(uPlateS, cs, uFade) + paperGrain(gl_FragCoord.xy + 4099.0, uDpr) * uGrainS;
      col = mix(col, sh, inS);
    }
  }
#endif
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

const FS_COPY = HDR + `
uniform sampler2D uTex;
in vec2 vUv;
layout(location = 0) out vec4 o;
#ifdef MULTI
uniform sampler2D uTexB;
layout(location = 1) out vec4 o1;
#endif
void main(){
  o = textureLod(uTex, vUv, 0.0);
#ifdef MULTI
  o1 = textureLod(uTexB, vUv, 0.0);
#endif
}`;

/* ══ GL PLUMBING ═══════════════════════════════════════════════════════ */

let W = 2, H = 2, DPR = 1, quality = 1;
let VX = 1, VY = 1, DX = 1, DY = 1;   // visible plate and whole domain, world units
let RW = 2, RH = 2, MW = 2, MH = 2;   // reference and flow-map texture sizes
let REF = [null, null], refCur = 0, MAP = [null, null], mapCur = 0;
let OPS = null, ZERO = null, vao = null, hasMap = false, lost = false;
let progBoot, progMap, progBake, progComp, progCopy, progBootId = null;

function shader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
function program(fs){
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error('link: ' + gl.getProgramInfoLog(p));
  const o = {p:p, u:{}};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){
    const info = gl.getActiveUniform(p, i);
    o.u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
  }
