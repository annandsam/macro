<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro — Sam Annand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --chalk: #ede9e4; --stone: #6e6860; }


  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0c0b09; --chalk: #ede9e4; --stone: #6e6860;
    --amber: #b89060; --slate: #1a1815;
  }
  html { height: 100%; }
  body {
    height: 100%; background: var(--ink); color: var(--chalk);
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    display: flex; justify-content: space-between; align-items: center;
    padding: 28px 48px;
    background: #acc6a1; border-bottom: 1px solid rgba(12,11,9,0.07);
  }
  .nav-logo {
    font-family: 'Space Mono', monospace; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(12,11,9,0.8); text-decoration: none;
  }
  .nav-links { display: flex; list-style: none; position: relative; }
  .nav-item { position: relative; }
  .nav-item > a {
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(12,11,9,0.75); text-decoration: none;
    transition: color 0.2s; padding: 8px 20px; display: block;
  }
  .nav-item > a:hover { opacity: 0.75; }

  /* Dropdowns */
  .dropdown-wrap {
    position: absolute; top: 100%; right: 0;
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
    min-width: 200px;
  }
  .nav-item:hover > .dropdown-wrap {
    max-height: 400px;
    overflow: visible;
    pointer-events: all;
  }
  .dropdown {
    background: #acc6a1;
    padding: 8px 0 12px;
    pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .nav-item:hover > .dropdown-wrap .dropdown {
    pointer-events: all;
  }
  .dropdown a {
    display: block; padding: 10px 20px;
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(237,233,228,0.8); text-decoration: none;
    transition: color 0.2s, background 0.2s; white-space: nowrap;
  }
  .dropdown a:hover {
    color: rgba(12,11,9,1); background: rgba(12,11,9,0.06);
  }
  .dd-section {
    font-family: 'Space Mono', monospace; font-size: 8px;
    letter-spacing: 0.25em; text-transform: uppercase;
    color: rgba(12,11,9,0.45); padding: 12px 20px 4px; display: block;
  }
  .dd-divider { height: 1px; background: rgba(12,11,9,0.12); margin: 6px 0; }

  /* ── LAYOUT ── */
  .hero {
    height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
  }

  /* ── LEFT ── */
  .hero-left {
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 48px 48px 64px;
    background: #4887c9;
  }
  h1.hero-name {
    font-family: 'Bodoni Moda', Georgia, serif;
    font-size: clamp(58px, 6.5vw, 105px);
    font-weight: 400; line-height: 1;
    letter-spacing: 0em; color: var(--chalk);
    opacity: 0; animation: fadeUp 1s ease 0.4s forwards;
    white-space: nowrap;
  }
  .hero-role {
    margin-top: 16px;
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(237,233,228,0.45);
    opacity: 0; animation: fadeUp 1s ease 0.6s forwards;
  }

  /* ── RIGHT: PAINTING ── */
  .hero-right { position: relative; overflow: hidden; }
  .painting-wrap {
    position: absolute; inset: 0;
    opacity: 0; animation: fadeIn 1.5s ease 0.1s forwards;
    display: flex; align-items: center; justify-content: center;
  }
  .painting-img {
    width: 100%; height: 100%; object-fit: cover;
    object-position: 50% 50%; display: block;
    filter: saturate(0.88) brightness(0.94);
  }
  .painting-caption {
    position: absolute; bottom: 32px; right: 32px;
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(237,233,228,0.35); text-align: right; line-height: 1.8;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  /* Flyout submenus */
  .flyout-item { position: relative; }
  .flyout-trigger {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px;
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(237,233,228,0.8); text-decoration: none;
    transition: color 0.2s, background 0.2s; white-space: nowrap;
    cursor: default;
  }
  .flyout-trigger:hover { color: rgba(12,11,9,1); background: rgba(12,11,9,0.06); }
  .flyout-arrow { opacity: 0.5; margin-left: 12px; font-size: 12px; }
  .flyout {
    position: absolute; left: 100%; top: 0;
    background: #acc6a1;
    min-width: 190px; padding: 8px 0;
    box-shadow: 4px 6px 20px rgba(0,0,0,0.4);
    white-space: nowrap;
    clip-path: inset(0 100% 0 0);
    transition: clip-path 0.22s ease;
    pointer-events: none;
  }
  .flyout-item:hover > .flyout {
    clip-path: inset(0 0% 0 0);
    pointer-events: all;
  }
  .flyout a {
    display: block; padding: 10px 20px;
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(12,11,9,0.8); text-decoration: none;
    transition: color 0.2s, background 0.2s;
  }
  .flyout a:hover { color: rgba(12,11,9,1); background: rgba(12,11,9,0.06); }

  /* ── MOBILE ── */
  @media (max-width: 768px) {
    nav { padding: 20px 24px; }
    .nav-links { gap: 0; }
    .nav-item > a { padding: 8px 12px; font-size: 9px; letter-spacing: 0.12em; }
    .dropdown { right: -12px; }

    .hero { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
    .hero-left {
      padding: 0 24px 32px;
      justify-content: flex-end;
      order: 1;
    }
    h1.hero-name { font-size: clamp(42px, 11vw, 72px); white-space: normal; }
    .hero-role { font-size: 9px; }
    .hero-right { order: 0; }
    .painting-caption { font-size: 8px; bottom: 16px; right: 16px; }
  }



  html, body {
    height: 100%;
    background: #014b4a;
    overflow: hidden;
  }
  .macro-page {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .macro-img {
    width: clamp(280px, 48vmin, 540px);
    opacity: 0;
    animation: fadeIn 1.8s ease 0.3s forwards;
  }
  .macro-label {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(237,233,228,0.3);
    white-space: nowrap;
    opacity: 0;
    animation: fadeIn 1.5s ease 1.6s forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @media (max-width: 768px) {
    nav { padding: 20px 24px; }
    .nav-item > a { padding: 8px 12px; font-size: 9px; }
    .macro-img { width: clamp(220px, 75vw, 380px); }
  }

  /* ── MOBILE HAMBURGER NAV ── */
  .nav-hamburger {
    display: none; background: none; border: none;
    cursor: pointer; padding: 4px 0;
    flex-direction: column; gap: 5px; z-index: 300;
  }
  .nav-hamburger span {
    display: block; width: 22px; height: 2px;
    background: rgba(12,11,9,0.75);
    transition: transform 0.25s, opacity 0.25s;
    transform-origin: center;
  }
  nav.nav-open .nav-hamburger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  nav.nav-open .nav-hamburger span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  nav.nav-open .nav-hamburger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  @media (max-width: 640px) {
    nav { padding: 16px 20px !important; position: relative; flex-wrap: wrap; align-items: center; }
    .nav-hamburger { display: flex; }

    .nav-links {
      display: none !important;
      position: absolute; top: 100%; left: 0; right: 0;
      background: #acc6a1;
      flex-direction: column !important; list-style: none; margin: 0;
      padding: 6px 0 16px; gap: 0 !important;
      border-top: 1px solid rgba(12,11,9,0.12);
      box-shadow: 0 10px 28px rgba(0,0,0,0.30);
      z-index: 250;
    }
    nav.nav-open .nav-links { display: flex !important; }

    .nav-item { width: 100%; position: relative; }
    .nav-item > a {
      padding: 13px 22px !important; font-size: 10px !important;
      letter-spacing: 0.18em !important; display: block;
      width: 100%; box-sizing: border-box;
    }

    /* Projects dropdown — inline accordion */
    .dropdown-wrap {
      position: static !important;
      max-height: 0 !important; overflow: hidden !important;
      transition: max-height 0.35s ease !important;
    }
    .dropdown-wrap.mob-open { max-height: 700px !important; overflow: visible !important; }
    .dropdown {
      position: static !important;
      box-shadow: none !important; pointer-events: all !important;
      background: #acc6a1 !important;
      padding: 0 0 6px !important;
    }
    .dropdown a { padding: 11px 40px !important; white-space: normal !important; }
    .dd-divider { margin: 4px 0 !important; }

    /* Flyout — inline sub-accordion */
    .flyout-item { position: static !important; }
    .flyout-trigger {
      cursor: pointer !important; padding: 11px 40px !important;
      white-space: normal !important;
    }
    .flyout-arrow { transition: transform 0.2s; display: inline-block; }
    .flyout-item.mob-open .flyout-arrow { transform: rotate(90deg); }
    .flyout {
      position: static !important; clip-path: none !important;
      display: none; box-shadow: none !important;
      background: #acc6a1 !important;
      padding: 0 !important; pointer-events: all !important;
    }
    .flyout.mob-open { display: block; }
    .flyout a { padding: 10px 56px !important; white-space: normal !important; }
  }
</style>

  <script>
  (function() {
    var nav = document.querySelector('nav');
    var burger = document.querySelector('.nav-hamburger');
    if (!burger || !nav) return;

    burger.addEventListener('click', function(e) {
      e.stopPropagation();
      var isOpen = nav.classList.toggle('nav-open');
      burger.setAttribute('aria-expanded', String(isOpen));
    });

    // Projects dropdown accordion
    var ddWrap = document.querySelector('.dropdown-wrap');
    if (ddWrap) {
      var ddItem = ddWrap.closest('.nav-item');
      var ddLink = ddItem ? ddItem.querySelector(':scope > a') : null;
      if (ddLink) {
        ddLink.addEventListener('click', function(e) {
          if (window.innerWidth <= 640) {
            e.preventDefault(); e.stopPropagation();
            ddWrap.classList.toggle('mob-open');
          }
        });
      }
    }

    // Flyout sub-accordions
    document.querySelectorAll('.flyout-item').forEach(function(fi) {
      var trigger = fi.querySelector('.flyout-trigger');
      var flyout  = fi.querySelector('.flyout');
      if (trigger && flyout) {
        trigger.addEventListener('click', function(e) {
          if (window.innerWidth <= 640) {
            e.preventDefault(); e.stopPropagation();
            fi.classList.toggle('mob-open');
            flyout.classList.toggle('mob-open');
          }
        });
      }
    });

    // Close on outside click
    document.addEventListener('click', function(e) {
      if (!nav.contains(e.target)) {
        nav.classList.remove('nav-open');
        burger.setAttribute('aria-expanded', 'false');
      }
    });

    // Close when a real link is tapped
    document.querySelectorAll('.nav-links a').forEach(function(a) {
      if (a.getAttribute('href') !== '#') {
        a.addEventListener('click', function() {
          nav.classList.remove('nav-open');
          burger.setAttribute('aria-expanded', 'false');
        });
      }
    });
  })();
  </script>
