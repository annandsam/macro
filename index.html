}
function L(pr, n){ const l = pr.u[n]; return l === undefined ? null : l; }

/* reference: RGBA8 ink fractions + thickness (and a second texture of four
   more fractions on a page with more than four inks), mipmapped for
   squeezed paint, both written at once through one framebuffer */
function mkRef(w, h){
  const t = mkRefTex(w, h), tB = MULTI ? mkRefTex(w, h) : null;
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  if (tB){
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, tB, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  }
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {t:t, tB:tB, f:f, w:w, h:h, ok:ok};
}
function mkRefTex(w, h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1 + Math.floor(Math.log2(Math.max(w, h))), gl.RGBA8, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  /* paint pulled in from past the margin is a mirror of what is there */
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
  if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(16, maxAniso));
  return t;
}
function mkMap(w, h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RG32F, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return withFB(t, w, h);
}
function withFB(t, w, h){
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {t:t, f:f, w:w, h:h, ok:ok};
}
function delTarget(x){
  if (!x) return;
  gl.deleteTexture(x.t);
  if (x.tB) gl.deleteTexture(x.tB);
  gl.deleteFramebuffer(x.f);
}
function toFB(x){
  gl.bindFramebuffer(gl.FRAMEBUFFER, x ? x.f : null);
  gl.viewport(0, 0, x ? x.w : W, x ? x.h : H);
}
function bindTex(unit, tex, l){
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(l, unit);
}
/* QA: window.MARBLE_SLOW = n, set before the engine runs, draws every pass n
   times over, to stand in for a slow GPU (a 2014 MacBook Air's Intel HD 5000 is
   some ten to twenty times slower than an M4) */
const SLOW = Math.max(1, Math.min(64, Math.round(+window.MARBLE_SLOW) || 1));
function draw(){
  gl.bindVertexArray(vao);
  for (let i = 1; i < SLOW; i++){ gl.drawArrays(gl.TRIANGLES, 0, 3); gl.flush(); }   // flushed, or an Apple GPU culls the repeats
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function mipmap(x){
  gl.bindTexture(gl.TEXTURE_2D, x.t);
  gl.generateMipmap(gl.TEXTURE_2D);
  if (x.tB){ gl.bindTexture(gl.TEXTURE_2D, x.tB); gl.generateMipmap(gl.TEXTURE_2D); }
}
const ZERO4 = new Float32Array(4);
function clearMap(){
  if (!hasMap) return;
  for (let i = 0; i < 2; i++){ toFB(MAP[i]); gl.clearBufferfv(gl.COLOR, 0, ZERO4); }
}
function setDomain(pr){
  gl.uniform2f(L(pr, 'uVis'), VX, VY);
  gl.uniform2f(L(pr, 'uDom'), DX, DY);
  gl.uniform1f(L(pr, 'uMarg'), MARG);
}

/* sized from the host panel, not the window. One world unit is the panel's
   geometric-mean side, so a phone and a desktop show the same density. */
function sizeFromHost(){
  const cssW = Math.max(2, host.clientWidth);
  const cssH = Math.max(2, host.clientHeight);
  /* full density up to 3x: iPhones are 3x, and at 2x the paint is upscaled
     by half again and its edges go soft */
  DPR = Math.max(0.5, Math.min(window.devicePixelRatio || 1, 3) * quality);
  W = Math.max(2, Math.round(cssW * DPR));
  H = Math.max(2, Math.round(cssH * DPR));
  const wu = Math.sqrt(cssW * cssH) / DETAIL;
  VX = cssW / wu; VY = cssH / wu;
  DX = VX + 2 * MARG; DY = VY + 2 * MARG;
  const px = wu * DPR;                        // device px per world unit
  const rs = Math.min(1, REF_CAP / (Math.max(DX, DY) * px));
  RW = Math.max(8, Math.round(DX * px * rs));
  RH = Math.max(8, Math.round(DY * px * rs));
  const ms = Math.min(0.5, MAP_CAP / (Math.max(DX, DY) * px));
  MW = Math.max(8, Math.round(DX * px * ms));
  MH = Math.max(8, Math.round(DY * px * ms));
  cv.width = W; cv.height = H;
}

/* (re)build targets. With an existing reference the plate is resampled into
   the new size — a resize or quality step never resets the marbling. */
function buildTargets(){
  const old = REF[refCur], spare = REF[1 - refCur];
  REF = [mkRef(RW, RH), mkRef(RW, RH)];
  refCur = 0;
  delTarget(MAP[0]); delTarget(MAP[1]);
  MAP = [null, null];
  hasMap = false;
  if (hasCBF){
    MAP = [mkMap(MW, MH), mkMap(MW, MH)];
    hasMap = MAP[0].ok && MAP[1].ok;
  }
  mapCur = 0;
  clearMap();
  if (old){
    toFB(REF[0]);
    gl.useProgram(progCopy.p);
    bindTex(0, old.t, L(progCopy, 'uTex'));
    if (MULTI) bindTex(1, old.tB, L(progCopy, 'uTexB'));
    draw();
    mipmap(REF[0]);
    delTarget(old); delTarget(spare);
    return true;
  }
  delTarget(spare);
  return false;
}

function initGL(){
  progBoot = program(FS_BOOT);
  progMap  = program(FS_MAP);
  progBake = program(FS_BAKE);
  progComp = program(FS_COMP);
  progCopy = program(FS_COPY);
  if (CFG.deal) progBootId = program(FS_BOOTID);
  vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.BLEND);
  OPS = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, OPS);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, NOPS * 2, 1, 0, gl.RGBA, gl.FLOAT, null);
  ZERO = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, ZERO);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, 1, 1, 0, gl.RG, gl.FLOAT, new Float32Array(2));
  return buildTargets();
}

/* ══ PALETTES ══════════════════════════════════════════════════════════ */

const PALETTES = CFG.palettes;
function hexLin(h){
  return [1, 3, 5].map(i => {
    const v = parseInt(h.slice(i, i + 2), 16) / 255;
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
}
const SETS = PALETTES.map(pl => FLAT ? pl.ink.map(hexLin) : pl.ab);
const inkU = new Float32Array(8 * 3);
const PLATE = [parseInt(CFG.plate.slice(1, 3), 16) / 255,
               parseInt(CFG.plate.slice(3, 5), 16) / 255,
               parseInt(CFG.plate.slice(5, 7), 16) / 255];
let palI = 0, palSrc = SETS[0], palDst = SETS[0], palT = 1, palNext = 16;
function ss(x){ return x * x * (3 - 2 * x); }
function palNow(){
  const k = palT >= 1 ? 1 : ss(palT);
  const out = [];
  for (let i = 0; i < palSrc.length; i++){
    out.push([ palSrc[i][0] + (palDst[i][0] - palSrc[i][0]) * k,
               palSrc[i][1] + (palDst[i][1] - palSrc[i][1]) * k,
               palSrc[i][2] + (palDst[i][2] - palSrc[i][2]) * k ]);
  }
  return out;
}
const shareSum = CFG.share.reduce((a, b) => a + b, 0);
let lastInk = -1;
function pickInk(avoid, rnd){
  rnd = rnd || Math.random;
  let k = 0;
  for (let tries = 0; tries < 6; tries++){
    let x = rnd() * shareSum;
    k = 0;
    while (k < NINK - 1 && x >= CFG.share[k]){ x -= CFG.share[k]; k++; }
    if (k !== avoid) break;
  }
  return k;
}
/* Dealing (CFG.deal): rather than drawing each drop's ink at random, give it
   to the ink furthest behind its share of the paint so far, with a little
   chance mixed in so the order never shows. Random draws can let one colour
   take a whole opening (measured on the homepage: green anywhere from 6% to
   39% of the plate). memory < 1 lets old drops fade from the tally. */
function dealer(rnd, memory){
  const got = new Float64Array(NINK);
  return function(r, avoid){
    const a = Math.PI * r * r;
    let tot = a;
    for (let k = 0; k < NINK; k++) tot += got[k];
    let best = 0, bd = -Infinity;
    for (let k = 0; k < NINK; k++){
      if (k === avoid) continue;
      const want = CFG.share[k] / shareSum * tot - got[k] + rnd() * a;
      if (want > bd){ bd = want; best = k; }
    }
    if (memory) for (let k = 0; k < NINK; k++) got[k] *= memory;
    got[best] += a;
    return best;
  };
}
const liveDeal = CFG.deal ? dealer(Math.random, 0.97) : null;
function liveInk(r, avoid){ return liveDeal ? liveDeal(r, avoid) : pickInk(avoid); }
function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let z = Math.imul(a ^ a >>> 15, 1 | a);
    z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
    return ((z ^ z >>> 14) >>> 0) / 4294967296;
  };
}

/* ══ SIMULATION STATE ══════════════════════════════════════════════════ */

const SIM_DT = 1 / 60;
const FADE_S = CFG.fade === undefined ? 0.5 : CFG.fade;   // fade-in once the opening is drawn
let fadeS = FADE_S;   // longer when the opening had to come a band a frame (bootTimed)
const P = {
  speed: reduced ? 0.4 : 1.0,   // overall pace of the bath
  /* samples a texel for the opening; at 3x density one is enough and keeps
     a phone's larger opening as quick as before */
  bootSS: (window.devicePixelRatio || 1) >= 2.5 ? 1 : 2,
  crisp: 0.25,                  // anti-diffusion per bake, on soft edges only
  autopilot: true,
  manual: false                 // QA: freeze the clock (pump() still steps)
};
let t = 0, acc = 0, tLastBake = 0, bakes = 0, fadeT0 = 0;

/* eddies: slow, overlapping, alternating — the bath never quite settles */
const vorts = [];
const vortU = new Float32Array(NV * 4);
function initVortices(rnd){
  vorts.length = 0;
  const sgn0 = rnd() < 0.5 ? -1 : 1;
  /* with a card over the bath (CFG.frame) each eddy turns near one of its
     edges, where it shows */
  const edge = () => rnd() < 0.5 ? 0.03 + 0.08 * rnd() : 0.89 + 0.08 * rnd();
  const nEd = CFG.nv ? NV : 2, spread = CFG.nv ? [0.06, 0.88] : [0.26, 0.48];
  for (let i = 0; i < nEd; i++){
    const across = frameEl ? rnd() < 0.5 : false;
    vorts.push({
      nx: frameEl && !across ? edge() : spread[0] + spread[1] * rnd(),
      ny: frameEl && across ? edge() : spread[0] + spread[1] * rnd(),
      ax: 0.08 + 0.08 * rnd(), ay: 0.08 + 0.08 * rnd(),
      px: 70 + 60 * rnd(), py: 70 + 60 * rnd(),
      phx: rnd() * TAU, phy: rnd() * TAU,
      R: 0.20 + 0.12 * rnd(),
      w0: 0.08 + 0.05 * rnd(),
      T: 46 + 30 * rnd(),
      ph: 0.5 + 0.9 * rnd(),       // turning at boot, so the opening swirl carries on
      sgn: i % 2 === 0 ? sgn0 : -sgn0
    });
  }
  stepVortices();
}
function vortCentre(v, tt){
  return [(v.nx + v.ax * Math.sin(TAU * tt / v.px + v.phx)) * VX,
          (v.ny + v.ay * Math.sin(TAU * tt / v.py + v.phy)) * VY];
}
function stepVortices(){
  for (let i = 0; i < NV; i++){
    const v = vorts[i];
    if (!v){ vortU[i * 4 + 2] = 0; vortU[i * 4 + 3] = 1; continue; }
    const c = vortCentre(v, t);
    vortU[i * 4] = c[0]; vortU[i * 4 + 1] = c[1];
    vortU[i * 4 + 2] = hasMap ? v.sgn * v.w0 * Math.sin(TAU * t / v.T + v.ph) : 0;
    vortU[i * 4 + 3] = v.R;
  }
}

/* stylus tips: the autopilot's strokes and the visitor's pointer */
const styP = new Float32Array(NS * 4), styB = new Float32Array(NS * 4);
let nSty = 0;
function addTip(x, y, vx, vy, sg){
  if (nSty >= NS) return;
  styP[nSty * 4] = x; styP[nSty * 4 + 1] = y;
  styP[nSty * 4 + 2] = vx; styP[nSty * 4 + 3] = vy;
  styB[nSty * 4] = sg;
  nSty++;
}

/* CPU mirror of vel(): drop centres ride the same flow as the paint */
const V1 = [0, 0], V2 = [0, 0];
function velAt(x, y, out){
  let vx = 0, vy = 0;
  for (let i = 0; i < NV; i++){
    const om = vortU[i * 4 + 2];
    if (om === 0) continue;
    const rx = x - vortU[i * 4], ry = y - vortU[i * 4 + 1], R = vortU[i * 4 + 3];
    const e = om * Math.exp(-(rx * rx + ry * ry) / (R * R));
    vx -= ry * e; vy += rx * e;
  }
  for (let j = 0; j < NS; j++){
    const sg = styB[j * 4];
    if (sg <= 0) continue;
    const rx = x - styP[j * 4], ry = y - styP[j * 4 + 1];
    const Vx = styP[j * 4 + 2], Vy = styP[j * 4 + 3];
    const s2 = sg * sg, k = s2 / (s2 + rx * rx + ry * ry);
    const c2 = 2 * k * k / s2 * (Vx * ry - Vy * rx);
    vx += k * Vx - c2 * ry; vy += k * Vy + c2 * rx;
  }
  out[0] = vx; out[1] = vy;
}
function ride(o, dt){
  velAt(o.cx, o.cy, V1);
  velAt(o.cx + 0.5 * dt * V1[0], o.cy + 0.5 * dt * V1[1], V2);
  o.cx += dt * V2[0]; o.cy += dt * V2[1];
}

/* drops: spread fast, then creep (ease-out), riding the flow as they go */
let drops = [];
const dropU = new Float32Array(ND * 4), dropB = new Float32Array(ND * 4);
let nDropU = 0;
function newDrop(x, y, R, ink, T){
  lastInk = ink;
  return {cx:x, cy:y, bx:x, by:y, R:R, Rn:R, r0:0, r:0, b:0, t0:t, T:T, u:0,
          ink:ink, seed:Math.random() * 10, hold:false};
}
function startDrops(list){
  if (booting) return;           // the opening is still being composed
  /* too many still spreading: let the oldest finish at once */
  let over = drops.length + list.length - ND;
  for (let i = 0; i < drops.length && over > 0; i++){
    const d = drops[i];
    if (!d.hold && d.u < 1){ d.u = 1; d.r = d.R; over--; }
  }
  bake();                        // everything so far goes into the reference
  for (const d of list){
    d.bx = d.cx; d.by = d.cy; d.b = 0; d.t0 = t;
    drops.push(d);
  }
}
function stepDrops(dt){
  for (const d of drops){
    ride(d, dt);
    if (d.hold){
      d.r = Math.min(d.Rn, 0.03 + 0.075 * Math.sqrt(Math.max(0, t - d.t0)));
    } else {
      d.u = Math.min(1, (t - d.t0) / d.T);
      const e = 1 - Math.pow(1 - d.u, 3);
      d.r = d.r0 + (d.R - d.r0) * e;
    }
  }
}
function packDrops(){
  let n = 0;
  for (const d of drops){
    if (n >= ND) break;
    dropU[n * 4] = d.bx; dropU[n * 4 + 1] = d.by;
    dropU[n * 4 + 2] = Math.max(0, d.r * d.r - d.b * d.b);
    dropU[n * 4 + 3] = d.Rn;
    dropB[n * 4] = d.ink; dropB[n * 4 + 1] = d.seed;
    dropB[n * 4 + 2] = d.r; dropB[n * 4 + 3] = 0;
    n++;
  }
  nDropU = n;
}
function setChain(pr){
  gl.uniform4fv(L(pr, 'uDrop'), dropU);
  gl.uniform4fv(L(pr, 'uDropB'), dropB);
  gl.uniform1i(L(pr, 'uNDrop'), nDropU);
}

/* bake: fold the map and the spreading drops into a fresh reference */
function bake(){
  packDrops();
  const src = REF[refCur], dst = REF[1 - refCur];
  toFB(dst);
  gl.useProgram(progBake.p);
  setDomain(progBake);
  setChain(progBake);
  gl.uniform1f(L(progBake, 'uPxW'), DX / RW);
  gl.uniform1f(L(progBake, 'uHasMap'), hasMap ? 1 : 0);
  gl.uniform1f(L(progBake, 'uCrisp'), P.crisp);
  bindTex(0, hasMap ? MAP[mapCur].t : ZERO, L(progBake, 'uMap'));
  bindTex(1, src.t, L(progBake, 'uRef'));
  if (MULTI) bindTex(2, src.tB, L(progBake, 'uRefB'));
  draw();
  mipmap(dst);
  refCur = 1 - refCur;
  clearMap();
  for (const d of drops){ d.b = d.r; d.bx = d.cx; d.by = d.cy; }
  drops = drops.filter(d => d.hold || d.u < 1);
  tLastBake = t;
  bakes++;
}

function stepMap(dt){
  if (!hasMap) return;
  const pr = progMap;
  toFB(MAP[1 - mapCur]);
  gl.useProgram(pr.p);
  setDomain(pr);
  gl.uniform4fv(L(pr, 'uVort'), vortU);
  gl.uniform4fv(L(pr, 'uStyP'), styP);
  gl.uniform4fv(L(pr, 'uStyB'), styB);
  gl.uniform1f(L(pr, 'uDt'), dt);
  bindTex(0, MAP[mapCur].t, L(pr, 'uMap'));
  draw();
  mapCur = 1 - mapCur;
}

/* ══ THE OPENING COMPOSITION ═══════════════════════════════════════════ */
/* Laid the way a marbler lays a bath: over a dark ground, small drops first
   (everything after squeezes them into rings and veins), then the main
   spots and a few big ones until the bath holds about 2.4 times its area in
   paint, two drops dropped into drops, one pass of a rake, the eddies'
   first turns, then fresh drops and specks on top. */
const opsBuf = new Float32Array(NOPS * 8);
const opFree = new Uint8Array(NOPS);    // drops whose colour the balancing may change
let bootN = 0, bootRow = 0, bootBand = 64, bootLast = 0, booting = false;
function composeBoot(rnd){
  let n = 0;
  const op = (a, b, c, d, e, f) => {
    if (n >= NOPS) return;
    opsBuf.set([a, b, c, d, e, f, 0, 0], n * 8);
    n++;
  };
  const drop = (x, y, r, ink, free) => {
    if (n < NOPS) opFree[n] = free ? 1 : 0;
    op(0, x, y, r, ink, rnd() * 10);
  };
  const rx = () => -MARG + rnd() * DX, ry = () => -MARG + rnd() * DY;
  const area = DX * DY;
  let ink = -1, cov = 0;
  const dealt = CFG.deal ? [dealer(rnd), dealer(rnd), dealer(rnd), dealer(rnd)] : null;
  const lay = (upto, rMin, rSpan, vein, layer) => {
    while (cov < upto * area && n < NOPS - 48){
      const r = rMin + rSpan * rnd();
      const veinDrop = rnd() < vein;
      ink = veinDrop ? CFG.ground : dealt ? dealt[layer](r, -1) : pickInk(ink, rnd);
      drop(rx(), ry(), r, ink, !veinDrop);
      cov += Math.PI * r * r;
    }
  };
  /* the first colour down is mostly the dark one: it ends up as the veins.
     A page can ask for less paint (cover) so more of its ground shows. */
  const cover = CFG.cover || [0.35, 1.85, 2.35];
  lay(cover[0], 0.035, 0.03, CFG.vein === undefined ? 0.5 : CFG.vein, 0);
  lay(cover[1], 0.055, 0.065, 0, 1);
  lay(cover[2], 0.11, 0.06, 0, 2);
  for (let b = 0; b < Math.round(2 * DETAIL * DETAIL); b++){   // as many per world area
    const x = (0.15 + 0.7 * rnd()) * VX, y = (0.15 + 0.7 * rnd()) * VY;
    let r = 0.10 + 0.05 * rnd();
    for (let k = 0; k < 3; k++){ ink = pickInk(ink, rnd); drop(x, y, r, ink); r *= 0.58 + 0.12 * rnd(); }
  }
  for (let k = 0; k < (CFG.rakes || 1); k++)        // CFG.rakes: more strokes across a zoomed-out still
    op(2, VX * (0.1 + 0.8 * rnd()), VY * (0.1 + 0.8 * rnd()), rnd() * Math.PI,
       (rnd() < 0.5 ? -1 : 1) * (0.06 + 0.06 * rnd()), 0.02 + 0.015 * rnd());
  for (const v of vorts){
    const c = vortCentre(v, 0);
    op(1, c[0], c[1], v.sgn * (2.0 + 1.6 * rnd()), v.R * 1.15, 0);
  }
  const fresh = cov + 0.2 * area;
  while (cov < fresh && n < NOPS - 16){
    const r = 0.04 + 0.06 * rnd();
    ink = dealt ? dealt[3](r, -1) : pickInk(ink, rnd);
    drop(rx(), ry(), r, ink, true);
    cov += Math.PI * r * r;
  }
  const nS = Math.round(7 * area);
  for (let i = 0; i < nS; i++) drop(rx(), ry(), 0.004 + 0.008 * rnd(), pickInk(-1, rnd));
  gl.bindTexture(gl.TEXTURE_2D, OPS);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, NOPS * 2, 1, gl.RGBA, gl.FLOAT, opsBuf);
  if (progBootId){
    balanceOpening(n, rnd);
    gl.bindTexture(gl.TEXTURE_2D, OPS);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, NOPS * 2, 1, gl.RGBA, gl.FLOAT, opsBuf);
  }
  bootN = n;
  bootRow = 0;
  booting = true;
}
/* Deal the opening's colours by visible area: find how much of the plate
   each drop ends up covering, then, biggest first, give each free drop an
   ink still short of its share (chosen at random among those, weighted by
   how short), so every visit opens near the intended balance without the
   same colours always landing in the same places. Fixed paint (the ground,
   veins, bullseyes, specks) counts toward its ink first. */
function balanceOpening(n, rnd){
  const iw = 96, ih = Math.max(8, Math.round(96 * VY / VX));
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, iw, ih);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, iw, ih);
  gl.useProgram(progBootId.p);
  setDomain(progBootId);
  gl.uniform1i(L(progBootId, 'uNOps'), n);
  bindTex(0, OPS, L(progBootId, 'uOps'));
  draw();
  const px = new Uint8Array(iw * ih * 4);
  gl.readPixels(0, 0, iw, ih, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fb);
  gl.deleteTexture(tex);

  const seen = new Float64Array(n), tally = new Float64Array(NINK);
  for (let i = 0; i < px.length; i += 4){
    const k = px[i] | (px[i + 1] << 8);
    if (k < n) seen[k]++; else tally[CFG.ground]++;
  }
  const free = [];
  for (let k = 0; k < n; k++){
    if (!seen[k]) continue;
    if (opsBuf[k * 8] < 0.5 && opFree[k]) free.push(k);
    else if (opsBuf[k * 8] < 0.5) tally[opsBuf[k * 8 + 4]] += seen[k];
  }
  free.sort((a, b) => seen[b] - seen[a]);
  const total = iw * ih;
  for (const k of free){
    const c = seen[k];
    let sum = 0, best = 0, bestD = -Infinity;
    const short = new Float64Array(NINK);
    for (let i = 0; i < NINK; i++){
      const d = CFG.share[i] / shareSum * total - tally[i];
      if (d > bestD){ bestD = d; best = i; }
      if (d >= 0.4 * c){ short[i] = d; sum += d; }
    }
    let ink = best;
    if (sum > 0){
      let x = rnd() * sum;
      for (let i = 0; i < NINK; i++){ x -= short[i]; if (short[i] > 0 && x <= 0){ ink = i; break; } }
    }
    opsBuf[k * 8 + 4] = ink;
    tally[ink] += c;
  }
}

/* render rows [y0, y1) of the opening; the whole thing is a few hundred
   operations a texel, so on page load it is spread over several frames */
function bootRows(y0, y1){
  const dst = REF[refCur];
  toFB(dst);
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(0, y0, RW, y1 - y0);
  gl.useProgram(progBoot.p);
  setDomain(progBoot);
  gl.uniform1i(L(progBoot, 'uNOps'), bootN);
  gl.uniform1i(L(progBoot, 'uGround'), CFG.ground);
  gl.uniform1i(L(progBoot, 'uSS'), P.bootSS);
  gl.uniform1f(L(progBoot, 'uPxW'), DX / RW);
  bindTex(0, OPS, L(progBoot, 'uOps'));
  draw();
  gl.disable(gl.SCISSOR_TEST);
  bootRow = y1;
  if (bootRow >= RH){
    mipmap(dst);
    booting = false;
    fadeT0 = t;
    TIMING.boot = Math.round(performance.now());
  }
}
/* one band per frame, its height steered by how long frames are taking */
function bootStep(now){
  if (bootLast){
    const ft = now - bootLast;
    if (ft > 28) bootBand = Math.max(4, bootBand >> 1);
    else if (ft < 20) bootBand = Math.min(RH, bootBand * 2);
  }
  bootLast = now;
  bootRows(bootRow, Math.min(RH, bootRow + bootBand));
  TIMING.bands++;
}
/* The opening is a few hundred operations a texel: some 50 ms of GPU on an M4,
   but most of a second or more on an old Intel Mac, and one draw that long can
   make the browser reset the GPU — the context is lost, restored, and the page
   opens again, over and over (Sam's 2014 MacBook Air, 2026-11-02). So a thin
   band is timed first, waiting on the GPU; the rest is drawn at once only if
   that will take under a quarter of a second, and otherwise a band of about
   12 ms a frame. A GPU that
   slow also starts the plate at a lower resolution (the loop's own stepping
   would take seconds of stutter to get there), and samples the opening once a
   texel rather than four times. */
const px1 = new Uint8Array(4);
function gpuWait(){ gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px1); }
function bootTimed(allAtOnce, again){
  gpuWait();
  bootRows(0, 1); gpuWait();                     // the first draw builds the pipeline: not timed
  let t0 = performance.now();
  gpuWait();
  const trip = performance.now() - t0;           // the wait's own round trip
  const n = Math.min(RH - 1, Math.max(8, Math.ceil(RH / 16)));
  t0 = performance.now();
  bootRows(1, 1 + n); gpuWait();
  let ms = Math.max(0, performance.now() - t0 - trip);
  let est = ms / n * RH;                         // ms for the whole opening in one draw
  if (est > 250 && 1 + 2 * n < RH){
    /* a GPU just woken from idle can time slow once: look again before acting on it */
    t0 = performance.now();
    bootRows(1 + n, 1 + 2 * n); gpuWait();
    ms = Math.min(ms, Math.max(0, performance.now() - t0 - trip));
    est = ms / n * RH;
  }
  let perRow = ms / n;
  TIMING.probe = [n, +ms.toFixed(2), +trip.toFixed(2)];
  TIMING.bootEst = Math.round(est);
  if (!again && !CFG.still && est > 250 && quality > Q_MIN){
    quality = Math.max(Q_MIN, Math.min(quality, Math.sqrt(200 / est)));
    sizeFromHost();
    buildTargets();
    bootRow = 0;
    bootTimed(allAtOnce, true);
    return;
  }
  if (allAtOnce && perRow * (RH - bootRow) < 250){ bootRows(bootRow, RH); return; }
  if (est > 400 && P.bootSS > 1 && !CFG.still){ P.bootSS = 1; perRow /= 4; }
  bootBand = Math.max(4, Math.min(RH, Math.floor(12 / perRow)));
  bootLast = 0;
  if (allAtOnce) fadeS = Math.max(FADE_S, 1.5);   // it was meant to open drawn: ease it in instead
}

/* ══ THE MARBLER (autopilot) ═══════════════════════════════════════════ */

const AP = {nextDrop: 0.35, nextStroke: 1.6, stroke: null, pending: []};
const rand = Math.random;
function inPlate(m){ return [(m + (1 - 2 * m) * rand()) * VX, (m + (1 - 2 * m) * rand()) * VY]; }
/* CFG.frame: the card's edges in world units (y up), and the surround's width */
function cardBox(){
  const c = cv.getBoundingClientRect(), f = frameEl.getBoundingClientRect();
  if (c.width < 2 || c.height < 2 || f.width < 2) return null;
  const kx = VX / c.width, ky = VY / c.height;
  return {x0: (f.left - c.left) * kx, x1: (f.right - c.left) * kx,
          y0: (c.bottom - f.bottom) * ky, y1: (c.bottom - f.top) * ky,
          gap: Math.max(1, f.left - c.left) * kx};
}
/* where a drop of radius R lands: anywhere on the plate or, with a card over
   the bath, somewhere along the card's edge (that share of the time:
   CFG.edgeBias), never so far under it that none of the drop shows round it */
const EDGE = CFG.edgeBias === undefined ? 1 : CFG.edgeBias;
function spot(m, R){
  const b = frameEl && rand() < EDGE && cardBox();
  if (!b) return inPlate(m);
  const w = b.x1 - b.x0, h = b.y1 - b.y0;
  const d = -0.7 * R + (0.7 * R + b.gap) * rand();   // outward from the edge
  let u = rand() * 2 * (w + h);
  if (u < w) return [b.x0 + u, b.y1 + d];
  u -= w;
  if (u < w) return [b.x0 + u, b.y0 - d];
  u -= w;
  if (u < h) return [b.x0 - d, b.y0 + u];
  return [b.x1 + d, b.y0 + u - h];
}

function apSingle(){
  const R = 0.07 + 0.08 * rand(), c = spot(0.06, R);
  startDrops([newDrop(c[0], c[1], R, liveInk(R, lastInk), 0.7 + 7 * R)]);
}
/* drops dropped into a drop: concentric rings */
function apBullseye(){
  const R = 0.10 + 0.07 * rand(), c = spot(0.12, R);
  const d1 = newDrop(c[0], c[1], R, liveInk(R, lastInk), 0.7 + 7 * R);
  startDrops([d1]);
  let Rk = R, at = t;
  const k = rand() < 0.6 ? 1 : 2;
  for (let i = 0; i < k; i++){
    Rk *= 0.55 + 0.15 * rand();
    at += 0.55 + 0.35 * rand();
    const RR = Rk;
    AP.pending.push({at: at, fn: () =>
      startDrops([newDrop(d1.cx, d1.cy, RR, liveInk(RR, lastInk), 0.6 + 6 * RR)])});
  }
}
/* a flick of the brush: a scatter of small drops landing together */
function apSprinkle(){
  const rad = 0.12 + 0.16 * rand(), c = spot(0.15, rad);
  const n = 5 + Math.floor(7 * rand());
  const list = [];
  let ink = lastInk;
  for (let i = 0; i < n; i++){
    const a = TAU * rand(), rr = rad * Math.sqrt(rand());
    const R = 0.012 + 0.024 * Math.pow(rand(), 1.5);
    ink = liveInk(R, ink);
    list.push(newDrop(c[0] + Math.cos(a) * rr, c[1] + Math.sin(a) * rr, R, ink, 0.5 + 6 * R));
  }
  startDrops(list);
}

/* CFG.frame: a stylus drawn along one of the card's sides through the middle
   of the surround, pulling the paint there along the edge */
function edgeStroke(){
  const b = cardBox();
  if (!b) return null;
  const w = b.x1 - b.x0, h = b.y1 - b.y0, out = 0.5 * b.gap;
  const u0 = rand() * 2 * (w + h);
  let p0, tx = 1, ty = 0, nx = 0, ny = 1, span = w;
  if (u0 < w) p0 = [b.x0, b.y1 + out];
  else if (u0 < 2 * w){ p0 = [b.x0, b.y0 - out]; ny = -1; }
  else {
    tx = 0; ty = 1; ny = 0; span = h;
    if (u0 < 2 * w + h){ p0 = [b.x0 - out, b.y0]; nx = -1; } else { p0 = [b.x1 + out, b.y0]; nx = 1; }
  }
  const L = Math.min(span, 0.3 + 0.45 * rand()), a = rand() * (span - L);
  const fwd = rand() < 0.5, amp = 0.3 * b.gap * rand(), ph = rand() * TAU;
  const s = {t0: t, kind: 'edge', offs: [0], sg: 0.014 + 0.008 * rand(), prev: null};
  s.path = u => {
    const along = a + (fwd ? u : 1 - u) * L, off = amp * Math.sin(TAU * 1.3 * u + ph);
    return [p0[0] + tx * along + nx * off, p0[1] + ty * along + ny * off];
  };
  s.dur = L * 1.1 / (0.06 + 0.04 * rand());
  return s;
}

/* strokes: a path(u) for the stroke's centre and the tine offsets across it */
function makeStroke(kind){
  if (frameEl && !kind && rand() < EDGE){ const e = edgeStroke(); if (e) return e; }
  const k = kind || ['spiral', 'curve', 'curve', 'comb', 'loop'][Math.floor(rand() * 5)];
  const s = {t0: t, kind: k, offs: [0], sg: 0.016 + 0.01 * rand(), prev: null};
  let len = 1, speed = 0.09 + 0.05 * rand();
  if (k === 'spiral'){
    const c = inPlate(0.28), rho0 = 0.10 + 0.10 * rand(), turns = 1.1 + 1.0 * rand();
    const dir = rand() < 0.5 ? 1 : -1, a0 = rand() * TAU;
    s.path = u => {
      const rr = rho0 * (1 - 0.72 * u), a = a0 + dir * TAU * turns * u;
      return [c[0] + rr * Math.cos(a), c[1] + rr * Math.sin(a)];
    };
    len = TAU * turns * rho0 * 0.64;
    s.sg = 0.015 + 0.008 * rand();
  } else if (k === 'loop'){
    const c = inPlate(0.3), a = 0.10 + 0.08 * rand(), th = rand() * TAU;
    const cs = Math.cos(th), sn = Math.sin(th);
    s.path = u => {
      const x = a * Math.sin(TAU * u), y = a * Math.sin(TAU * u) * Math.cos(TAU * u);
      return [c[0] + cs * x - sn * y, c[1] + sn * x + cs * y];
    };
    len = 4.6 * a;
  } else {
    /* a curve or a comb: drawn across a good part of the plate */
    const comb = k === 'comb';
    const a0 = rand() * TAU, L = comb ? 0.5 + 0.4 * rand() : 0.55 + 0.4 * rand();
    const m = inPlate(0.3);
    const dx = Math.cos(a0), dy = Math.sin(a0);
    const amp = comb ? 0.03 * rand() : 0.05 + 0.08 * rand();
    const waves = 0.6 + 1.0 * rand(), ph = rand() * TAU;
    s.path = u => {
      const along = L * (u - 0.5), off = amp * Math.sin(TAU * waves * u + ph);
      return [m[0] + dx * along - dy * off, m[1] + dy * along + dx * off];
    };
    len = L * 1.15;
    if (comb){
      const n = 4 + Math.floor(4 * rand()), gap = 0.045 + 0.02 * rand();
      s.offs = [];
      for (let i = 0; i < n; i++) s.offs.push((i - (n - 1) / 2) * gap);
      s.sg = 0.011 + 0.004 * rand();
      speed = 0.06 + 0.03 * rand();
    }
  }
  s.dur = len / speed;
  return s;
}
/* the stroke's tips this step; the stylus is lowered and lifted gently */
function strokeTips(s, dt){
  const u = Math.min(1, (t - s.t0) / s.dur);
  const e = 1e-3;
  const p = s.path(u), q = s.path(Math.min(1, u + e));
  let nx = -(q[1] - p[1]), ny = q[0] - p[0];
  const nl = Math.hypot(nx, ny) || 1;
  nx /= nl; ny /= nl;
  const gain = ss(Math.min(1, u / 0.05)) * (1 - ss(Math.max(0, (u - 0.93) / 0.07)));
  if (!s.prev) s.prev = s.offs.map(o => [p[0] + nx * o, p[1] + ny * o]);
  for (let i = 0; i < s.offs.length; i++){
    const x = p[0] + nx * s.offs[i], y = p[1] + ny * s.offs[i];
    const vx = (x - s.prev[i][0]) / dt, vy = (y - s.prev[i][1]) / dt;
    s.prev[i][0] = x; s.prev[i][1] = y;
    if (gain > 0.001) addTip(x, y, vx * gain, vy * gain, s.sg);
  }
  return u >= 1;
}

function autopilot(dt){
  for (let i = AP.pending.length - 1; i >= 0; i--){
    if (t >= AP.pending[i].at){ const f = AP.pending[i].fn; AP.pending.splice(i, 1); f(); }
  }
  if (!P.autopilot) return;
  AP.nextDrop -= dt;
  if (AP.nextDrop <= 0){
    AP.nextDrop = 5.5 + 4.5 * rand();
    const r = rand();
    if (r < 0.5) apSingle(); else if (r < 0.72) apBullseye(); else apSprinkle();
  }
  /* the visitor's own stylus takes precedence over the marbler's */
  if (!AP.stroke && hasMap && t - lastUser > 4){
    AP.nextStroke -= dt;
    if (AP.nextStroke <= 0) AP.stroke = makeStroke();
  }
}

/* ══ INPUT STATE ═══════════════════════════════════════════════════════ */

const hov = {on:false, x:0, y:0, tx:0, ty:0, vx:0, vy:0};
const HOVER_VMAX = 0.45, HOVER_SG = 0.022, HOVER_GAIN = 0.9;
let lastUser = -99, pour = null;
let pDown = false, pId = null, pT0 = 0, pDist = 0, pMoved = false, pHolding = false;
let pX = 0, pY = 0;

function hoverTips(dt){
  if (!hov.on) return;
  const dx = hov.tx - hov.x, dy = hov.ty - hov.y;
  const dl = Math.hypot(dx, dy), mx = HOVER_VMAX * dt;
  const k = dl > mx ? mx / dl : 1;
  hov.x += dx * k; hov.y += dy * k;
  hov.vx += (dx * k / dt - hov.vx) * 0.5;
  hov.vy += (dy * k / dt - hov.vy) * 0.5;
  if (Math.abs(hov.vx) + Math.abs(hov.vy) > 1e-4)
    addTip(hov.x, hov.y, hov.vx * HOVER_GAIN, hov.vy * HOVER_GAIN, HOVER_SG);
}

/* ══ STEP ══════════════════════════════════════════════════════════════ */

function stepSim(dt){
  if (!(dt > 0)) return;          // stylus velocities divide by dt
  /* palette morph */
  palT = Math.min(1, palT + dt / 3.5);
  palNext -= dt;
  if (palNext <= 0){
    palSrc = palNow();
    palI = (palI + 1) % PALETTES.length;
    palDst = SETS[palI];
    palT = 0;
    palNext = 28 + Math.random() * 14;
  }

  autopilot(dt);

  /* press and hold: pour paint that keeps spreading while held */
  /* CFG.noPour: a page full of controls keeps press-and-hold for itself */
  if (pDown && pHolding && !pMoved && !pour && !CFG.noPour && performance.now() - pT0 >= HOLD_MS){
    const w = toWorld(pX, pY);
    if (w.inside){
      pour = newDrop(w.x, w.y, 0.2, liveInk(0.12, lastInk), 1);
      pour.hold = true;
      startDrops([pour]);
    }
  }

  stepVortices();
  nSty = 0;
  styB.fill(0);
  if (AP.stroke && strokeTips(AP.stroke, dt)){
    AP.stroke = null;
    /* rest between strokes, so fresh drops keep up with the combing */
    AP.nextStroke = 4 + 6 * rand();
  }
  hoverTips(dt);

  stepDrops(dt);
  stepMap(dt);

  /* bake every few seconds, preferably between drops' fast first spread */
  const since = t - tLastBake;
  const busy = drops.some(d => d.hold || d.u < 0.8);
  const every = CFG.bakeEvery || 4;   // CFG.bakeEvery: stills bake more often, so hard stretching stays smooth
  if (since > every && (!busy || since > 2 * every)) bake();

  t += dt;
}

/* ══ RENDER ════════════════════════════════════════════════════════════ */

function render(){
  packDrops();
  const pal = palNow();
  const pr = progComp;
  toFB(null);
  gl.useProgram(pr.p);
  setDomain(pr);
  setChain(pr);
  gl.uniform1f(L(pr, 'uPxW'), VX / W);
  gl.uniform1f(L(pr, 'uHasMap'), hasMap ? 1 : 0);
  bindTex(0, hasMap ? MAP[mapCur].t : ZERO, L(pr, 'uMap'));
  bindTex(1, REF[refCur].t, L(pr, 'uRef'));
  if (MULTI) bindTex(2, REF[refCur].tB, L(pr, 'uRefB'));
  if (FLAT){
    inkU.fill(0);
    for (let i = 0; i < pal.length; i++) inkU.set(pal[i], i * 3);
    gl.uniform3fv(L(pr, 'uInk'), inkU);
    gl.uniform1f(L(pr, 'uShade'), CFG.shade);
  } else {
    gl.uniform3fv(L(pr, 'uAb0'), pal[0]);
    gl.uniform3fv(L(pr, 'uAb1'), pal[1]);
    gl.uniform3fv(L(pr, 'uAb2'), pal[2]);
    gl.uniform3fv(L(pr, 'uAb3'), pal[3]);
    gl.uniform3fv(L(pr, 'uLamp'), CFG.lamp);
    gl.uniform3fv(L(pr, 'uBase'), CFG.base);
    gl.uniform1f(L(pr, 'uCreamLo'), CFG.creamLo);
    gl.uniform1f(L(pr, 'uCreamAmt'), CFG.creamAmt);
  }
  gl.uniform3fv(L(pr, 'uPlate'), PLATE);
  gl.uniform1f(L(pr, 'uHot'), CFG.hot);
  gl.uniform1f(L(pr, 'uVig'), CFG.vig);
  gl.uniform1f(L(pr, 'uGrain'), CFG.grain === undefined ? 0.016 : CFG.grain);
  gl.uniform1f(L(pr, 'uSeedT'), Math.floor(t * 24) % 4096);
  gl.uniform1f(L(pr, 'uDpr'), DPR);
  /* the opening is ready a few hundredths of a second after the page paints,
     so it comes in quickly and fast-first: half there in 0.1 s, all by 0.5 s */
  const f = Math.min(1, Math.max(0, (t - fadeT0) / fadeS));
  gl.uniform1f(L(pr, 'uFade'), 1 - (1 - f) * (1 - f) * (1 - f));
  if (frameEl) drawFrame(); else draw();
  /* the page may copy what was just drawn (the menu's rollover) */
  const hook = window.MARBLE && window.MARBLE.onFrame;
  if (hook) hook(cv);
}
/* CFG.frame: only what shows round the card is drawn — the four strips
   outside it, and its corners as far in as their rounding reaches. Each runs
   2 device px under the card, so its antialiased edge has paint behind it.
   CFG.reveal: elements on the card that show the bath too (the page copies
   the paint behind them in through MARBLE.onFrame), drawn as well. */
function drawFrame(){
  const c = cv.getBoundingClientRect(), f = frameEl.getBoundingClientRect();
  if (c.width < 2 || c.height < 2 || f.width < 2){ draw(); return; }
  const sx = W / c.width, sy = H / c.height, e = 2;
  const radCss = parseFloat(getComputedStyle(frameEl).borderTopLeftRadius) || 0;
  const reveal = [];
  if (CFG.reveal) for (const el of document.querySelectorAll(CFG.reveal)){
    const r = el.getBoundingClientRect();
    reveal.push([(r.left - c.left) * sx - e, (r.top - c.top) * sy - e,
                 (r.right - c.left) * sx + e, (r.bottom - c.top) * sy + e]);
  }
  if (SHADOW){
    /* the whole canvas: the bath round the card and its shadow under it; then
       the revealed items again in colour, for the page to copy */
    shadowOn(c, f, sx, sy, radCss);
    draw();
    gl.uniform1f(L(progComp, 'uSOn'), 0);
    scissored(reveal);
    return;
  }
  const rad = radCss * sx + e;
  const cl = (f.left - c.left) * sx + e, cr = (f.right - c.left) * sx - e;
  const ct = (f.top - c.top) * sy + e, cb = (f.bottom - c.top) * sy - e;
  scissored([[0, 0, W, ct], [0, cb, W, H], [0, ct, cl, cb], [cr, ct, W, cb],
             [cl, ct, cl + rad, ct + rad], [cr - rad, ct, cr, ct + rad],
             [cl, cb - rad, cl + rad, cb], [cr - rad, cb - rad, cr, cb]].concat(reveal));
}
/* draw only inside these rects (device px from the top left) */
function scissored(rects){
  if (!rects.length) return;
  gl.enable(gl.SCISSOR_TEST);
  for (const q of rects){
    const x0 = Math.max(0, Math.floor(q[0])), x1 = Math.min(W, Math.ceil(q[2]));
    const y0 = Math.max(0, Math.floor(q[1])), y1 = Math.min(H, Math.ceil(q[3]));
    if (x1 <= x0 || y1 <= y0) continue;
    gl.scissor(x0, H - y1, x1 - x0, y1 - y0);    // GL counts rows from the bottom
    draw();
  }
  gl.disable(gl.SCISSOR_TEST);
}
/* CFG.shadow: each ink as the card's colour scaled by the ink's lightness, the
   card's colour and grain, and where the card is (its edge 1 css px in, under
   its border), as centre and half size in GL device px */
const inkS = new Float32Array(8 * 3);
const SH_BASE = SHADOW ? hexLin(CFG.shadow.base) : null;
const SH_PLATE = SHADOW ? [1, 3, 5].map(i => parseInt(CFG.shadow.base.slice(i, i + 2), 16) / 255) : null;
function shadowOn(c, f, sx, sy, radCss){
  const pr = progComp, S = CFG.shadow, pal = palNow();
  inkS.fill(0);
  for (let i = 0; i < pal.length; i++){
    const p = pal[i], k = S.lo + (S.hi - S.lo) * (0.2126 * p[0] + 0.7152 * p[1] + 0.0722 * p[2]);
    inkS[i * 3] = SH_BASE[0] * k; inkS[i * 3 + 1] = SH_BASE[1] * k; inkS[i * 3 + 2] = SH_BASE[2] * k;
  }
  gl.uniform3fv(L(pr, 'uInkS'), inkS);
  gl.uniform3fv(L(pr, 'uPlateS'), SH_PLATE);
  gl.uniform1f(L(pr, 'uGrainS'), S.grain);
  /* 1 css px in by default, under the card's border; a page with no border asks for less */
  const ins = S.inset === undefined ? 1 : S.inset;
  /* S.clipTop: the card stops at the foot of that element (a pinned bar it scrolls under) */
  let top = f.top;
  const clip = S.clipTop && document.querySelector(S.clipTop);
  if (clip) top = Math.max(top, clip.getBoundingClientRect().bottom);
  const x0 = (f.left - c.left + ins) * sx, x1 = (f.right - c.left - ins) * sx;
  const y0 = (top - c.top + ins) * sy, y1 = (f.bottom - c.top - ins) * sy;
  gl.uniform4f(L(pr, 'uSRect'), 0.5 * (x0 + x1), H - 0.5 * (y0 + y1), 0.5 * (x1 - x0), 0.5 * (y1 - y0));
  gl.uniform1f(L(pr, 'uSRad'), Math.max(0, radCss - ins) * sx);
  gl.uniform1f(L(pr, 'uSInv'), S.invert ? 1 : 0);
  gl.uniform1f(L(pr, 'uSOn'), 1);
}

/* ══ INPUT ═════════════════════════════════════════════════════════════ */
/* The canvas is pointer-events:none and every listener is on window, reading
   the pointer against the canvas rect — so the bath answers through album
   sleeves, panels and text alike. Gestures are chosen so nothing the page
   needs gets stolen:
     move             → a stylus drawn through the paint, everywhere
     short tap        → a drop of paint, unless the tap landed on a link or a
                        field, which then behaves normally
     press and hold   → pour paint, which spreads for as long as you hold,
                        anywhere but a field; the click that would have
                        followed is swallowed */

const HOLD_MS = 420;

function toWorld(cx, cy){
  const r = cv.getBoundingClientRect();
  let inside = cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
  /* CFG.frame: the pointer works the bath round the card, and through the
     card too when the card shows the bath (CFG.shadow) — never over
     CFG.noInput (the menus), whose links and presses stay the page's */
  if (inside && frameEl){
    if (SHADOW){
      const el = CFG.noInput && document.elementFromPoint(cx, cy);
      inside = !(el && el.closest(CFG.noInput));
    } else {
      const f = frameEl.getBoundingClientRect();
      inside = !(cx > f.left && cx < f.right && cy > f.top && cy < f.bottom);
    }
  }
  return {x: (cx - r.left) / Math.max(1, r.width) * VX,
          y: (1 - (cy - r.top) / Math.max(1, r.height)) * VY,
          inside: inside};
}
function hits(el, sel){ return !!(el && el.closest && el.closest(sel)); }
const FIELD = 'input, textarea, select, label, button';
const LINKY = 'a, button, input, textarea, select, label';
let swallowClick = false;

function hoverTo(w){
  if (!hov.on){ hov.on = true; hov.x = hov.tx = w.x; hov.y = hov.ty = w.y; hov.vx = hov.vy = 0; }
  hov.tx = w.x; hov.ty = w.y;
  lastUser = t;
}
function releasePour(){
  if (!pour) return;
  pour.hold = false;
  pour.r0 = pour.r; pour.R = pour.r * 1.1 + 0.008;
  pour.t0 = t; pour.T = 0.8; pour.u = 0;
  pour = null;
}
function onDown(id, cx, cy, target, stamp){
  const w = toWorld(cx, cy);
  if (!w.inside) return;
  pDown = true; pId = id; pT0 = stamp; pDist = 0; pMoved = false;
  pX = cx; pY = cy;
  /* a field keeps its own press; anything else can pour */
  pHolding = !hits(target, FIELD);
  /* the stylus goes straight down where you press — never dragged across
     from wherever the last touch was */
  hov.on = false;
  hoverTo(w);
}
function onMove(id, cx, cy){
  if (pDown && id === pId){
    pDist += Math.abs(cx - pX) + Math.abs(cy - pY);
    pX = cx; pY = cy;
    if (!pMoved && pDist > 10){
      pMoved = true;
      releasePour();
      pHolding = false;
    }
  }
  const w = toWorld(cx, cy);
  if (!w.inside){ hov.on = false; return; }
  hoverTo(w);
}
function onUp(id, cx, cy, target, stamp, lift){
  if (lift) hov.on = false;            // a finger leaving the glass lifts the stylus
  if (id !== pId) return;
  const w = toWorld(cx, cy);
  if (pour){
    releasePour();
    swallowClick = true;               // the hold was ours: cancel the click
  } else if (!pMoved && w.inside && stamp - pT0 < HOLD_MS && !hits(target, LINKY)){
    /* a quick tap on a link or a field belongs to the page, not the bath */
    const R = 0.045 + 0.03 * Math.random();
    startDrops([newDrop(w.x, w.y, R, liveInk(R, lastInk), 0.6 + 6 * R)]);
  }
  pDown = false; pId = null; pMoved = false; pHolding = false;
}
function onCancel(){
  releasePour();
  pDown = false; pId = null; pHolding = false;
}

if (window.PointerEvent){
  window.addEventListener('pointerdown', e => {
    onDown(e.pointerId, e.clientX, e.clientY, e.target, e.timeStamp);
    if (e.pointerType === 'mouse' && toWorld(e.clientX, e.clientY).inside && !hits(e.target, FIELD))
      e.preventDefault();
  }, {passive:false});
  window.addEventListener('pointermove', e => onMove(e.pointerId, e.clientX, e.clientY), {passive:true});
  window.addEventListener('pointerup', e => onUp(e.pointerId, e.clientX, e.clientY, e.target, e.timeStamp,
                                                 e.pointerType !== 'mouse'), {passive:true});
  window.addEventListener('pointercancel', () => { hov.on = false; onCancel(); }, {passive:true});
} else {
  window.addEventListener('mousedown', e => {
    onDown('m', e.clientX, e.clientY, e.target, e.timeStamp);
    if (toWorld(e.clientX, e.clientY).inside && !hits(e.target, FIELD)) e.preventDefault();
  });
  window.addEventListener('mousemove', e => onMove('m', e.clientX, e.clientY));
  window.addEventListener('mouseup', e => onUp('m', e.clientX, e.clientY, e.target, e.timeStamp));
  window.addEventListener('touchstart', e => {
    const tt = e.changedTouches[0];
    onDown(tt.identifier, tt.clientX, tt.clientY, e.target, e.timeStamp);
  }, {passive:true});
  window.addEventListener('touchmove', e => {
    const tt = e.changedTouches[0];
    onMove(tt.identifier, tt.clientX, tt.clientY);
  }, {passive:true});
  window.addEventListener('touchend', e => {
    const tt = e.changedTouches[0];
    onUp(tt.identifier, tt.clientX, tt.clientY, e.target, e.timeStamp, true);
  }, {passive:true});
}
document.addEventListener('mouseleave', () => { hov.on = false; });
/* capture phase: kill the navigation a long press would otherwise trigger */
window.addEventListener('click', e => {
  if (!swallowClick) return;
  swallowClick = false;
  e.preventDefault();
  e.stopPropagation();
}, true);
/* a long press on a sleeve must not raise the iOS callout or a context menu */
window.addEventListener('contextmenu', e => {
  if (toWorld(e.clientX, e.clientY).inside && !hits(e.target, FIELD)) e.preventDefault();
});

/* resize: fold everything into the reference, then resample it */
let resizeTimer = 0;
function resize(){
  if (lost) return;
  if (booting || RW < 64 || RH < 64){
    /* still composing the opening, or it was composed while the panel had
       no real size: compose it again at the new size rather than upscale */
    sizeFromHost();
    buildTargets();
    boot((Math.random() * 4294967296) >>> 0);
    bootTimed(false, true);
    return;
  }
  if (REF[0]) bake();
  sizeFromHost();
  buildTargets();
  for (const d of drops) d.u = 1;
  drops = [];
  pour = null;
  AP.stroke = null;
  AP.pending.length = 0;
  hov.on = false;
}
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 120);
});
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ══ CONTEXT LOSS ══════════════════════════════════════════════════════ */

let losses = 0;
cv.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  lost = true;
  losses++;
  if (raf){ cancelAnimationFrame(raf); raf = 0; }
}, false);
cv.addEventListener('webglcontextrestored', () => {
  lost = false;
  /* lost twice: this GPU can't keep the bath going. Leave the plain panel
     rather than opening again and again. Once: start again lighter. */
  if (losses >= 2){ cv.style.display = 'none'; return; }
  quality = Math.min(quality, 0.6);
  P.bootSS = 1;
  REF = [null, null]; MAP = [null, null];
  try {
    sizeFromHost();
    initGL();
    boot((Math.random() * 4294967296) >>> 0);
    bootTimed(false, true);
    render();
  } catch (err){
    cv.style.display = 'none';
    return;
  }
  last = 0; acc = 0;
  if (!raf && !document.hidden) raf = requestAnimationFrame(loop);
}, false);

/* ══ LOOP ══════════════════════════════════════════════════════════════ */

let raf = 0, last = 0, frames = 0, slowMs = 0, frozen = false;
const Q_MIN = 0.4;                               // DPR is floored at 0.5 besides
const FT = new Float32Array(9).fill(16.7);       // the last nine frame times
let ftN = 0;
function ftMedian(){ return Array.from(FT).sort((a, b) => a - b)[4]; }

function loop(now){
  raf = requestAnimationFrame(loop);
  if (lost) return;
  /* a background never needs more than about 60 frames a second */
  if (last && now - last < 10.5) return;
  const raw = last ? now - last : 16.7;
  const dt = Math.min(Math.max(raw / 1000, 0), 0.05);
  last = now;
  frames++;
  /* recover from a zero-size boot once real layout exists */
  if ((W < 8 || H < 8) && (frames & 63) === 0 && host.clientWidth > 4) resize();

  if (booting){ bootStep(now); return; }

  /* Step quality down only when frames are genuinely slow: the median of the
     last nine past 40 ms, for a second in all. A steady 30 fps is a cap (iOS
     Low Power Mode, battery savers), not a struggling GPU — reading it as slow
     halved the resolution on iPhones within half a minute. The median lets an
     odd long gap through (a bake, a page back from the background), where the
     old rule ignored every frame past 90 ms — on an old Intel Mac that was every
     frame, so it never stepped down at all. At the floor and still under about
     14 fps (software WebGL), the plate is left still once it has faded in. */
  FT[ftN++ % 9] = Math.min(raw, 250);
  if (ftN >= 9){
    const med = ftMedian();
    if (med > 40){
      slowMs += raw;
      if (slowMs > 1000){
        slowMs = 0;
        if (quality > Q_MIN){ quality = Math.max(Q_MIN, quality * 0.75); ftN = 0; resize(); }
        else if (med > 70 && t - fadeT0 > fadeS + 0.5){
          frozen = true;
          cancelAnimationFrame(raf); raf = 0;
          render();
          return;
        }
      }
    } else slowMs = Math.max(0, slowMs - raw);
  }

  if (!P.manual){
    acc += dt;
    let steps = 0;
    while (acc >= SIM_DT && steps < 4){ stepSim(SIM_DT * P.speed); acc -= SIM_DT; steps++; }
    if (steps >= 4) acc = 0;
  }
  render();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }
  else if (!raf && !lost && !frozen){
    last = 0; acc = 0; ftN = 0; raf = requestAnimationFrame(loop);
  }
});

/* ══ BOOT ══════════════════════════════════════════════════════════════ */

function boot(seed){
  const rnd = mulberry(seed);
  t = 0;
  initVortices(rnd);
  composeBoot(rnd);
  /* a quarter of the opening in the first frame, then doubling while frames
     stay quick — typically three frames in all */
  bootBand = Math.max(64, Math.ceil(RH / 4)); bootLast = 0;
  drops = [];
  pour = null;
  clearMap();
  tLastBake = 0;
  fadeT0 = 0;
  AP.nextDrop = 0.35; AP.nextStroke = 1.6; AP.stroke = null; AP.pending.length = 0;
}

/* QA handle, as on the other plates */
window.MARBLE = {
  P: P,
  CFG: CFG,                           // QA: change a setting, then reboot()
  onFrame: null,                      // the page's: called with the canvas after each frame is drawn
  pump(n){
    if (booting) bootRows(bootRow, RH);
    for (let i = 0; i < (n || 1); i++) stepSim(SIM_DT * P.speed);
    render();
  },
  timing: TIMING,
  stats(){
    return {t: +t.toFixed(2), drops: drops.length, bakes: bakes, W: W, H: H, RW: RW, RH: RH,
            MW: MW, MH: MH, VX: +VX.toFixed(3), VY: +VY.toFixed(3), quality: quality,
            hasMap: hasMap, fps: +(1000 / ftMedian()).toFixed(1), frozen: frozen,
            stroke: AP.stroke ? AP.stroke.kind : null};
  },
  reboot(seed){
    boot(seed === undefined ? (Math.random() * 4294967296) >>> 0 : seed);
    bootRows(0, RH);                  // all at once, for QA
    render();
  },
  drop(x, y, R, ink){
    R = R || 0.08;
    startDrops([newDrop(x * VX, y * VY, R, ink === undefined ? liveInk(R, lastInk) : ink, 0.7 + 7 * R)]);
  },
  stroke(kind){ AP.stroke = makeStroke(kind); return AP.stroke.dur; },
  bake: () => bake(),
  setPalette(i){ palSrc = palDst = SETS[i % SETS.length]; palI = i; palT = 1; }
};

try {
  sizeFromHost();
  initGL();
  TIMING.gl = Math.round(performance.now());
  boot((Math.random() * 4294967296) >>> 0);
  /* CFG.instant: draw the whole opening now rather than a band a frame, so
     the page opens on marbling (it is a few tens of ms of GPU work) — unless
     the GPU is slow (bootTimed) */
  bootTimed(!!CFG.instant);
  render();
  if (!CFG.still) raf = requestAnimationFrame(loop);   /* CFG.still: draws only on MARBLE.pump() */
} catch (err) {
  /* shader or context failure: leave the plain panel colour */
  cv.style.display = 'none';
  if (window.console) console.warn('marbling:', err && err.message ? err.message : err);
}
})();
</script>
<script>
/* The menu's rollover is the marbling: a menu item under the pointer gets a small
   canvas behind its label, and after every frame of the bath (which paints behind the
   item too: CFG.reveal) the paint there is copied in, under a light veil so the label
   reads. Without the marbling the rollover stays the green band.
   The canvas runs a pixel past the item on every side inside a clipping span: items
   sit at fractional pixel positions, and a canvas the item's exact size snapped a
   device pixel short of its border, leaving a white hairline (Sam, 2026-10-23). */
(function(){
  const bath = document.getElementById('marble-canvas');
  if (!window.MARBLE || !bath || bath.style.display === 'none') return;
  const HOVER = MARBLE.CFG.reveal, root = document.documentElement;
  /* the card goes see-through only while the marbling is drawing its shadow */
  root.classList.add('marble-menu', 'marble-plate');
  bath.addEventListener('webglcontextlost', () => root.classList.remove('marble-plate'));
  bath.addEventListener('webglcontextrestored', () => root.classList.add('marble-plate'));

  MARBLE.onFrame = function(src){
    const items = document.querySelectorAll(HOVER);
    if (!items.length) return;
    const b = src.getBoundingClientRect();
    const kx = src.width / b.width, ky = src.height / b.height;
    for (const el of items){
      let clip = el.querySelector(':scope > .peek'), pk;
      if (!clip){
        clip = document.createElement('span');
        clip.className = 'peek';
        clip.setAttribute('aria-hidden', 'true');
        clip.appendChild(document.createElement('canvas'));
        el.prepend(clip);
      }
      pk = clip.firstChild;
      const r = pk.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) continue;
      const w = Math.round(r.width * kx), h = Math.round(r.height * ky);
      if (pk.width !== w || pk.height !== h){ pk.width = w; pk.height = h; }
      const g = pk.getContext('2d');
      g.drawImage(src, (r.left - b.left) * kx, (r.top - b.top) * ky, r.width * kx, r.height * ky, 0, 0, w, h);
      g.fillStyle = 'rgba(18, 22, 18, 0.36)';
      g.fillRect(0, 0, w, h);
    }
  };
})();
</script>
